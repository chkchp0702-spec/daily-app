	function initKeyword() {

	function fn_more(type, cnt) {
		$j('#option').val(type);
		
		if (type == 'corp') {

				return;

			var str = '';
			if($j('input:checkbox[name=docNm]:checked').length > 1) {
				$j('input:checkbox[name=docNm]:checked').each(function(i) {
					if(i > 0) {

					}
					str += $j(this).val();

			}
			$j('#reportName').val(str);
			$j('#reportNamePopYn').val('Y');
			$j('#tocSrch').val('');

			$j('#textCrpCik').val('');

	function preCheck(page) {
		if (document.getElementById("tat_table")) {

				alert("검색어는 2자이상 입력하셔야합니다.");
				return;
			}
		}
		return true;
	}

	/**
	 * 검색
	 */
	function search(page , gubun) {
		if (!preCheck(page)) {
			return;
		}
		if (useAjax) {
			return;
		}
		//회사명 팝업에서 선택 후 자동 조회되는거 막음.
		if (isCorpSearch) {
			isCorpSearch = false;
			return;
		}

		var frm = findForm("searchForm");

		useAjax = true;
		if ($j("#option").val() == "") { //전체일때

			// 검색조건 Ajax 호출
			xajax.blockUI = true;
			xajax.blockTarget = "listContents";
			xajax.timeout = 240000;
			checkUseAjaxTimer = setTimeout("useAjax=false", xajax.timeout);
			if(gubun != undefined) {
				setLateKeyword();
			}
			$j('#searchGubun').val('SEARCH');
			xajax.sendForm("searchForm", "/dsab007/unifiedSearch.ax", function(html) {
				$j('#listContents').html(html);
				useAjax = false;
			});
		} else if($j("#option").val() == 'contents'){
			xajax.blockUI = true;
			xajax.blockTarget = "listContents";
			xajax.timeout = 240000;
			$j('#SchSug').remove();
			checkUseAjaxTimer = setTimeout("useAjax=false", xajax.timeout);
			xajax.sendForm("searchForm", "/dsab007/detailSearchMain2.do", function(html) {
				$j('#page').html(html);
				useAjax = false;
			});
		} else {
			// 검색조건 Ajax 호출
			xajax.blockUI = true;
			xajax.blockTarget = "listContents";
			xajax.timeout = 240000;
			checkUseAjaxTimer = setTimeout("useAjax=false", xajax.timeout);
			$j('#SchSug').remove();
			$j('#winCorpInfo').remove();    
			$j('#winFindReport').remove();
			$j('#winFindReportList').remove();
			xajax.sendForm("searchForm", "/dsab007/detailSearchMain.do", function(html) {
				$j('#page').html(html);
				useAjax = false;
			});
		} 
	}
	
	function setLateKeyword() {
		var jsonInfo = {};
		var optionVal = $j('#option').val();
		var recentWord = [];
		jsonInfo.keyword = $j('#keyword').val();
		jsonInfo.typeText = '전체';
		jsonInfo.type = optionVal;
		
		recentWord.push(jsonInfo);
		
		var searchInfoJson = getSearchInfo();
		if(searchInfoJson != null) {
			var jsonLength = searchInfoJson.length;
			for(var i =0; i<searchInfoJson.length;i++ ) {
				var exist = false;
				for(var r=0;r<recentWord.length;r++){
					if(recentWord[r].keyword == searchInfoJson[i].keyword &&
							recentWord[r].typeText == searchInfoJson[i].typeText &&
							recentWord[r].type == searchInfoJson[i].type){
						exist = true;
						break;
					}
				}
				if(exist == false){
					recentWord.push(searchInfoJson[i]);
				}
			}
			if(recentWord.length > 10) {
				recentWord.splice(10,1);
			}
		}
		
		fn_setLocalStorage('searchInfo',recentWord);
		
		searchInfoJson = JSON.parse(fn_getLocalStorage('searchInfo'));
		makeLatestSelect(searchInfoJson, 'lateKeyword');
	}

	function setInput(option) {
		$j('#winCorpInfo').remove();    
		$j('#winFindReport').remove(); 
		$j('#winFindReportList').remove();
		
		if(option == 'contents') {
			$j('#SchSug').remove();
			xajax.blockUI = true;
			xajax.blockTarget = "listContents";
			xajax.timeout = 240000;
			checkUseAjaxTimer = setTimeout("useAjax=false", xajax.timeout);
			xajax.sendForm("searchForm", "/dsab007/detailSearchMain2.do", function(html) {
				$j('#page').html(html);
			});
		}else if(option == 'high') {
			var frm = findForm("searchForm");
			frm.currentPage.value = 1;
			frm.action = "/dsab009/main.do";
			frm.submit();			
		} else if(option == 'corp' || option =='report' || option == 'reportList'){
			$j('#SchSug').remove();
			xajax.blockUI = true;
			xajax.blockTarget = "listContents";
			xajax.timeout = 240000;
			checkUseAjaxTimer = setTimeout("useAjax=false", xajax.timeout);
			
			xajax.sendForm("searchForm", "/dsab007/detailSearchMain.do", function(html) {
				$j('#page').html(html);
				useAjax = false;
			});
		}
	}
	function fn_typeChange(obj) {
		var option = $j(obj).val();
		$j("#inputSub").empty();
		$j("#searchForm")[0].reset();
		$j('#autoSearch').val('N');
		$j("#option").val(option);
		$j('#textCrpNm').val('');
		$j('#textCrpCik').val('');
		$j('#keyword').val('');
		
		setInput(option);
	}
	
	function reportChk(obj, nm) {
		if($j('input:checkbox[name=' + nm + ']:checked').length >10) {
			$j(obj).prop('checked', false);
			alert('보고서명은 최대 10개까지만 선택 가능합니다.');
			return;
		}
	}
	
	function corpChk(obj, nm) {
		if($j('input:checkbox[name=' + nm + ']:checked').length >10) {
			$j(obj).prop('checked', false);
			alert('회사명은 최대 10개까지만 선택 가능합니다.');
			return;
		}
		
		var ciks=getRefNm('hiddenCikCD1');
		var chks=getRefNm(nm);
		var strCiks="";
		var strChks="";
		for(var i=0;i<chks.length;i++){
			if(chks[i].checked==true){
				strCiks+=ciks[i].value+" ";
				strChks+=chks[i].value+"/";
			}
		}
		findElementInForm('searchForm','textCrpCik').value=strCiks.substr(0,strCiks.length-1);
		findElementInForm('searchForm','textCrpNm').value=strChks.substr(0,strChks.length-1);
	}
	
	function fn_lateKeywordChange(index) {
		var searchInfoJson = getSearchInfo();
		if(searchInfoJson != null) {
			var json = searchInfoJson[index];

			$j("#searchForm")[0].reset();
			$j('#option').val(json.type);
			//$j("#lateKeyword").val(index).prop("selected", true);
			$j('#searchForm input[name=lateKeyword]').val(index);
			if(json.type == '') {
				$j('#keyword').val(json.keyword);
				$j('#hFrame, #SchSug').hide();
				search(1);
			} else if(json.type == 'corp') {
				$j('#textCrpNm').val(json.keyword);
				$j('#autoSearch').val('Y');
				setInput(json.type);	
			} else if(json.type == 'report') {
				$j('#reportName').val(json.keyword);
				$j('#autoSearch').val('Y');
				setInput(json.type);	
			} else if(json.type == 'reportList') {
				$j('#tocSrch').val(json.keyword);
				$j('#autoSearch').val('Y');
				setInput(json.type);
			} else if(json.type == 'high') { 
				$j('#autoSearch').val('Y');
				setInput(json.type);	
			} else {
				$j('#keyword').val(json.keyword);
				$j('#autoSearch').val('Y');
				setInput(json.type);
			}
		}
		$j('#spanText').text(json.keyword);
		fn_ulListToggle();
	}
	
	function fn_ulListToggle() {
		if (!$j("#dropdownContent").is(":visible")) {
			var searchInfoJson = getSearchInfo();
			if (searchInfoJson != null) {
				$j("#dropdownContent").show();
				document.getElementById("dropdownContent").classList
						.toggle("show");
			}
		} else {
			$j("#dropdownContent").hide();
		}
	}
	
	function fn_ulListRemover(index){		
		//로컬스토리지 삭제
		var searchInfoJson = getSearchInfo();
		 var recentWord = [];
		 var jsonInfo = {};
		 
		 fn_removeLocalStorage('searchInfo');
		 
		 if(searchInfoJson != null) {
			 for(var i =0; i<searchInfoJson.length;i++ ) {
				 if(i != index){
					 recentWord.push(searchInfoJson[i]);
					 fn_setLocalStorage('searchInfo',recentWord);
				 }
			 }
			 
		 }

		 var resultSearchInfoJson = getSearchInfo();
			if(resultSearchInfoJson != null){
				makeMainLatestSelect(resultSearchInfoJson, 'lateKeyword');	
			}else{
				$j('#lateKeyword_0').remove();
				$j('#spanText').text("선택");
				document.getElementById("dropdownContent").classList
				.toggle("show");
			}
	}
