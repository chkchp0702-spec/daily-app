    <script type="text/javascript">
        var igcommon_www_domain = "securities.miraeasset.com";
        var _gl_main_common = {
            nowDate : "20261016",
            nowTime : "1028"
        };
        $(document).ready(function() {
            mainEvt();

            mainBannerLoad();
            callCommonA01();
            callCommonA02();
            setInterval(function(){
                clearInterval(makeJiusIntever);
                callCommonA01();
            },1000*60);
        });

        //지수 조회
        function callCommonA01() {
            var params = {
                dumy	: "0"
            };
            $.ajax({
                url         : "/public/main/home_main_jisu.wjson",
                data        : params,
                type		: "POST",
                dataType	: "json",
                success     : commonA01Complete
            });
        }
        var makeJiusIntever = "";
        var codeNameList = {
            "K0001"     : "KOSPI",
            "KQ001"     : "KOSDAQ",
            "CME@NQ"    : "나스닥100선물",
            "CME@ES"    : "S&P500선물",
            "DJI@DJI"   : "다우산업"
        };
        var fadeJisuIndex = 0;
        function commonA01Complete(data) {
            if (data.result > 0 || data.result == "error") {
                return;
            } else {
                var jisuIndex = 0;
                var temp = "";
                for(var  i =0 ; i < data.list.length ; i++){
                    var dataInfo = data.list[i];
                    var jisuDiff    = "";
                    var jisuClass   = "";
                    var jisuValue   = "";
                    rcod = dataInfo.rcod; //RTS SYMBOL
                    code = dataInfo.code; //지수구분
                    jisu = dataInfo.jisu; //지수
                    diff = dataInfo.diff; //대비
                    updn = dataInfo.updn; //등락율

                    if(!codeNameList.hasOwnProperty(rcod)) continue;
                    if(!isCommonNull(jisu)){
                        if( jisu.substring(0,1) == "+" || jisu.substring(0,1) == "-" ){
                            jisu = jisu.substring(1).trim();
                        }
                        jisuValue = numberFormatWN(jisu, '###,###.00');
                    }
                    if(!isCommonNull(diff)){
                        var sign = diff.substring(0, 1);
                        jisuDiff = diff.substring(1);
                        if("1"==sign || "2"== sign){
                            jisuClass = "up";
                        }else if("4"== sign || "5"== sign){
                            jisuClass = "down";
                        }
                    }
                    if(jisuIndex==fadeJisuIndex){
                        temp += "<div class='jisuSubLayer'>";
                    }else{
                        temp += "<div class='jisuSubLayer' style='display: none'>";
                    }
                    temp += "<p>"+codeNameList[rcod]+"</p>";
                    temp += "<div>";
                    temp += "<strong class='market_index'>"+jisuValue+"</strong>";
                    temp += "<div class='return "+jisuClass+"'>";
                    temp += "<span>"+jisuDiff+"</span>";
                    temp += "<em>"+updn+"</em>";
                    temp += "</div>";
                    temp += "</div>";
                    temp += "</div>";
                    jisuIndex++;
                }
                if(temp!=""){
                    $("#jisuLayer").html(temp);
                    fadeJisuIndex++;
                    makeJiusIntever = setInterval(function(){
                        makeFadeJisu();
                    },1000*2);
                }
            }
        }

        function makeFadeJisu(){
            var $items = $(".jisuSubLayer");
            $items.finish().hide();
            $items.eq(fadeJisuIndex).fadeIn(500);
            fadeJisuIndex = (fadeJisuIndex + 1) % $items.length;
        }

        //research 조회
        function callCommonA02() {
            var params = {};
            $.ajax({
                url         : "/common/a02.json",
                data        : params,
                type		: "POST",
                dataType	: "json",
                success     : commonA02Complete
            });
        }
        var researchArrayList = new Array();
        function commonA02Complete(data) {
            var list = data.list;
            if(!isCommonNull(list)){
                for(var i=0;i<list.length;i++){
                    var obj = list[i];
                    var CATEGORY_ID = obj.GROUP_CATEGORY_ID;
                    researchArrayList[CATEGORY_ID] = obj;
                }
            }
            makeResearch();
        }

        var categoryList = [
            { id: "1533", name: "국내 기업분석" },
            { id: "1525", name: "산업분석" },
            { id: "1531", name: "해외 기업분석" },
            { id: "1527", name: "투자전략" },
            { id: "1526", name: "글로벌 ETF" }
        ];
        function makeResearch(){
            var temp = "";
            categoryList.forEach(function(item) {
                var id = item.id;
                var name = item.name;
                var obj = researchArrayList[id];
                var title = obj.TITLE;
                var categoryId = obj.GROUP_CATEGORY_ID;
                var messageId = obj.MESSAGE_ID;
                if(!isCommonNull(title)){
                    title = title.replaceAll("||", "<br/>");
                }
                if(categoryId=="1533"||categoryId=="1531"){
                    categoryId="1800";
                }
                temp += '<a href="/bbs/board/message/view.do'
                    + '?categoryId=' + categoryId
                    + '&messageId=' + messageId
                    + '">';
                temp += "<em>"+name+"</em>";
                temp += "<span>";
                temp += "<strong>"+title+"</strong>";
                temp += "<em>자세히 보기</em>";
                temp += "</span>";
                temp += "</a>";
            });
            $("#researchLayer").html(temp);
        }

        function mainBannerLoad(){
            var url = " /public/banner/event.banner02.wjson";
            callAjaxObj({
                url 	: url,	//호출페이지
                success	: function(data){
                    if(!isCommonNull(data)){
                        var len = data.length;
                        if(len > 0){
                            var temp = "";
                            for(var i=0; i<len; i++){
                                var obj = data[i];
                                var START_DT 	= obj.START_DT; 	//시작일자
                                var START_TIME	= obj.START_TIME;	//시작시간
                                var END_DT		= obj.END_DT;		//종료일자
                                var END_TIME	= obj.END_TIME;		//종료시간

                                //게시체크
                                if(	Number(_gl_main_common.nowDate) < Number(START_DT	) ||	//시작일자 이전
                                    Number(_gl_main_common.nowDate) > Number(END_DT		) ||	//종료일자 이후
                                    (_gl_main_common.nowDate == START_DT 	&& Number(_gl_main_common.nowTime) < Number(START_TIME	)) ||	//시작일인경우 현재시간이전
                                    (_gl_main_common.nowDate == END_DT 		&& Number(_gl_main_common.nowTime) > Number(END_TIME	))		//종료일인경우 현재시간이후
                                ) continue;

                                /* eventBannerCtrl 함수는 gnb에 있음... */

                                var attrTitle = "";
                                if(obj.LINK_TYPE == "N"){
                                    attrTitle ='title="새 창"';
                                }
                                temp += "<li>";
                                temp += "	<a href='javascript:eventBannerCtrl(\""+obj.AREA_CD+"\", \""+obj.BNR_CD+"\", \""+obj.LINK_TYPE+"\", \""+obj.LINK_URL+"\");' "+attrTitle+">";
                                temp += "		<img src='https://"+igcommon_www_domain+"/public/event/"+obj.IMAGE_URL+"' alt='"+ obj.BNR_NM +"하단참조' />";
                                temp += "	</a>";
                                temp += "	<dl class='hide'>";
                                temp += "		<dt>"+obj.BNR_NM+"</dt>";
                                temp += "		<dd>";
                                temp += "			<p class='date'>"+dateFormat(START_DT, "yyyy.MM.dd")+" - "+dateFormat(END_DT, "yyyy.MM.dd")+"</p>";
                                temp += "			<p>"+obj.CONTENT+"</p>";
                                temp += "		</dd>";
                                temp += "	</dl>";
                                temp += "</li>";
                            }
                            $("#mainBannerlayer").html(temp);

                            if(len>1){
                                $(".slider").bxSlider({
                                    controls : false, autoControls:true, pager : true,
                                    speed: 1000, minSlides: 1, maxSlides: 2, moveSlides: 2, slideWidth:620, touchEnabled : false,
                                    auto: true, autoControlsCombine: true, autoDelay : 3000, pause : 3000,
                                });
                            }
                        }else{
                            $('#eventWrap').hide();
                        }
                    }else{
                        $('#eventWrap').hide();
                    }
                }
                ,load	: false
            });
        }

        function mainEvt(){
            /* 탭 영역 */
            $('.quick_tab > li > a').click(function(){
                $('.quick_tab > li > a').removeClass('active');
                $(this).addClass('active');

                if( $('.quick_tab > li > a.menu_02').hasClass('active') ){
                    $('.quick_menu_wrap').addClass('active');
                    $('.bookmark'		).finish().hide();
                    $('.firstinfo'		).css('display','flex');
                }else{
                    $('.quick_menu_wrap').removeClass('active');
                    $('.firstinfo'		).finish().hide();
                    $('.bookmark'		).css('display','flex');
                }
                return false;
            });
        }
    </script>
