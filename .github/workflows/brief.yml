name: brief
# ☀️ PB 한 장 — 매일 아침 8시 고정 (10/28 사용자 「동료 PB」). GitHub 예약이 늦을 수 있어 07:50 부터 세 번 시도, 같은 key 라 한 번만 감.
on:
  schedule:
    - cron: "50 22 * * 1-5"   # KST 07:50
    - cron: "58 22 * * 1-5"   # KST 07:58
    - cron: "10 23 * * 1-5"   # KST 08:10 (예비)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brief
  cancel-in-progress: false
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas
      - name: ☀️ PB 한 장
        run: |
          python pbbrief.py || echo "아침판 실패"
          python proposal.py || echo "📝 제안서 기본폼 실패"   # 10/28 아침 시황에 맞춘 제안서 9종
          python plus.py brief
      - name: 저장 (보낸 기록)
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          bash scripts/push.sh "brief $(TZ=Asia/Seoul date '+%F %H:%M')" archive/x/sent.json archive/x/push_log.json archive/x/users.json archive/x/pbbrief.json archive/x/proposal.json
