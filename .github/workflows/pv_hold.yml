name: pv_hold
# 🧺 사모펀드 「구성 엿보기」 — 운용사별 DART 5% 대량보유 보고서 → archive/x/pv_hold.json (공개 자료만)
on:
  schedule:
    - cron: "47 21 * * 0-4"   # KST 06:47 평일
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pv_hold
  cancel-in-progress: false
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: DART 대량보유
        run: python pv_hold.py
      - name: 저장
        run: bash scripts/push.sh "pv_hold $(TZ=Asia/Seoul date '+%F %H:%M')" archive/x/pv_hold.json
