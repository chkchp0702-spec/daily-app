name: collect
# 각 프로그램 레포의 새 자료를 모아 앱에 누적한다.
on:
  schedule:
    - cron: "5 22 * * *"    # KST 07:05
    - cron: "23 22 * * *"   # KST 07:23 (컵·갭·고래 새벽 결과)
    - cron: "55 22 * * *"   # KST 07:55 (8시 전 마지막)
    - cron: "40 22 * * *"   # KST 07:40 (시황 8시 전)
    - cron: "5 23 * * *"    # KST 08:05 (나침반 8시 반 전)
    - cron: "35 23 * * *"   # KST 08:35 (컵·갭·매집 9시 전)
    - cron: "25 0 * * *"    # KST 09:25 (고래 10시 전)
    - cron: "43 0 * * *"    # KST 09:43 (시황·브리핑)
    - cron: "43 1 * * 1-5"  # KST 10:43 (단타 장중)
    - cron: "43 2 * * 1-5"  # KST 11:43 (단타 장중)
    - cron: "43 4 * * 1-5"  # KST 13:43 (단타 장중)
    - cron: "43 5 * * 1-5"  # KST 14:43 (단타 장중)
    - cron: "13 6 * * *"    # KST 15:13 (단타 장중)
    - cron: "33 7 * * *"    # KST 16:33 (단타 마감)
    - cron: "53 12 * * *"   # KST 21:53 (예비)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 자료 레포 받기
        run: |
          mkdir -p _src
          for r in stock-screener whale40 Cup Gap market-strategy-report sector-watch; do
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/chkchp0702-spec/$r _src/$r || echo "fail $r"
          done
      - run: python collect.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 성적표·고래·매집·알림 (extras)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          pip install -q yfinance pandas
          python extras.py || echo "extras 일부 실패"
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive manifest.json
          git diff --cached --quiet || (git commit -m "collect $(TZ=Asia/Seoul date '+%F %H:%M')" && git pull --rebase -q && git push)
