name: lotto
# 🎱 로또 당첨 번호 모으기 — 동행복권 공식 JSON → archive/x/lotto.json (토요일 추첨 20:45 뒤 몇 번 시도)
on:
  schedule:
    - cron: "5 12 * * 6"    # KST 토 21:05
    - cron: "35 12 * * 6"   # KST 토 21:35 (늦게 올라올 때)
    - cron: "5 13 * * 6"    # KST 토 22:05
    - cron: "5 22 * * 6"    # KST 일 07:05 (예비)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lotto
  cancel-in-progress: false
jobs:
  lotto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 🎱 당첨 번호 받기
        run: python lotto.py
      - name: 저장
        run: bash scripts/push.sh "lotto $(TZ=Asia/Seoul date '+%F %H:%M')" archive/x/lotto.json
