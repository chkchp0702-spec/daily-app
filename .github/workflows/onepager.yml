name: onepager
# 원페이지 종목 리포트
#  - 자동: 매일 단타 알람·조용한 매집 종목
#  - 요청: 이슈 제목을 "원페이지: 종목명" 으로 올리면 그 종목 생성 (저장소 주인만)
on:
  schedule:
    - cron: "53 22 * * *"   # KST 07:53
    - cron: "3 8 * * 1-5"   # KST 17:03 (단타 마감 후)
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      query:
        description: "종목명 또는 코드 (비우면 자동 생성)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: onepager
  cancel-in-progress: false

jobs:
  make:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '원페이지') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 원페이지 프로그램 받기
        run: |
          git clone -q --depth 1 https://github.com/chkchp0702-spec/stock-onepager _src/stock-onepager
          pip install -q yfinance pandas
      - name: 종목 정하기
        id: q
        env:
          TITLE: ${{ github.event.issue.title }}
          INPUT: ${{ github.event.inputs.query }}
        run: |
          Q="$INPUT"
          if [ -n "$TITLE" ]; then Q=$(printf '%s' "$TITLE" | sed -E 's/^원페이지[[:space:]]*[:：]?[[:space:]]*//'); fi
          echo "query=$Q" >> $GITHUB_OUTPUT
      - name: 만들기
        env:
          Q: ${{ steps.q.outputs.query }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$Q" ]; then python onepager_batch.py --query "$Q"; else python onepager_batch.py --auto; fi
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive manifest.json
          git diff --cached --quiet || (git commit -m "onepager $(TZ=Asia/Seoul date '+%F %H:%M')" && git pull --rebase -q && git push)
      - name: 요청한 이슈에 답하고 닫기
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          R=$(cat onepager_result.txt 2>/dev/null || true)
          if [ -n "$R" ]; then
            MSG="✅ 완료! 1~2분 뒤 앱의 **원페이지** 탭에서 볼 수 있어요. https://${{ github.repository_owner }}.github.io/daily-app/"
          else
            MSG="⚠️ 종목을 찾지 못했어요. 코드(예: 005930, AAPL)로 다시 요청해 주세요."
          fi
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$MSG"
          gh issue close "$NUM" --repo "${{ github.repository }}"
