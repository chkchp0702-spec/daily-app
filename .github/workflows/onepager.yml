name: onepager
# 원페이지 종목 리포트
#  - 자동: 매일 단타 알람·조용한 매집 종목 (KST 07:53, 17:03)
#  - 요청: 앱에서 보낸 요청을 5분마다 확인해서 생성 (누구나)
on:
  schedule:
    - cron: "53 22 * * *"   # KST 07:53 자동
    - cron: "3 8 * * 1-5"   # KST 17:03 자동
    - cron: "*/5 * * * *"   # 요청 확인
  workflow_dispatch:
    inputs:
      query:
        description: "종목명 또는 코드 (비우면 자동 생성)"
        required: false

permissions:
  contents: write

concurrency:
  group: onepager
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 할 일 정하기
        id: mode
        env:
          CRON: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.query }}
        run: |
          if [ -n "$INPUT" ]; then echo "mode=query" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CRON" = "53 22 * * *" ] || [ "$CRON" = "3 8 * * 1-5" ]; then
            echo "mode=auto" >> $GITHUB_OUTPUT; exit 0
          fi
          SINCE=$(cat onepager_since.txt 2>/dev/null || echo 12h)
          N=$(curl -s "https://ntfy.sh/chkchp-onepager-req-7k3q/json?poll=1&since=$SINCE" | grep -c '"event":"message"' || true)
          if [ "$N" -gt 0 ]; then echo "mode=poll" >> $GITHUB_OUTPUT; else echo "mode=none" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'none'
        with:
          python-version: "3.12"
      - name: 원페이지 프로그램 받기
        if: steps.mode.outputs.mode != 'none'
        run: |
          git clone -q --depth 1 https://github.com/chkchp0702-spec/stock-onepager _src/stock-onepager
          pip install -q yfinance pandas
      - name: 만들기
        if: steps.mode.outputs.mode != 'none'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          Q: ${{ github.event.inputs.query }}
        run: |
          case "$MODE" in
            query) python onepager_batch.py --query "$Q" ;;
            poll)  python onepager_batch.py --poll ;;
            auto)  python onepager_batch.py --poll --auto ;;
          esac
      - name: 저장
        if: steps.mode.outputs.mode != 'none'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive manifest.json onepager_since.txt 2>/dev/null || git add archive manifest.json
          git diff --cached --quiet || (git commit -m "onepager $(TZ=Asia/Seoul date '+%F %H:%M')" && git pull --rebase -q && git push)
