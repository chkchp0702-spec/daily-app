name: regime
# 🧭 국면 신호판 — FRED·야후·opdata·네이버에서 선행지표를 모아 archive/x/regime.json
on:
  schedule:
    - cron: "50 22 * * *"   # KST 07:50 (미국 마감·FRED 갱신 뒤)
    - cron: "10 8 * * 1-5"  # KST 17:10 (한국 마감 뒤 외국인·환율)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: regime
  cancel-in-progress: false
jobs:
  regime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas
      - run: python regime.py 2>&1 | tee archive/x/regime_log.txt
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive/x/regime.json archive/x/regime_log.txt
          git diff --cached --quiet || (git commit -m "regime $(TZ=Asia/Seoul date '+%F %H:%M')" && git pull --rebase -q && git push)
