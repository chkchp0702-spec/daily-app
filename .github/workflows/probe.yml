name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas && python probe/probe.py
      - run: |
          mkdir pb && cp probe_out.json pb/ && cd pb
          git init -q -b probe && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe:probe
