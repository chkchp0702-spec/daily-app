name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          O="https://chkchp0702-spec.github.io"
          for u in "https://searchapi.eastmoney.com/api/suggest/get?input=KOSDAQ&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=5" "https://searchapi.eastmoney.com/api/suggest/get?input=%E9%9F%A9%E5%9B%BD&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=10" "https://searchapi.eastmoney.com/api/suggest/get?input=KS11&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=5"; do
            echo "=== $u" >> out.txt
            rm -f h.txt b.txt; touch h.txt b.txt; curl -s -m 15 -D h.txt -o b.txt -H "Origin: $O" -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" "$u"
            head -1 h.txt >> out.txt; grep -i "access-control-allow-origin\|content-type\|^location" h.txt >> out.txt
            head -c 1500 b.txt | iconv -f gbk -t utf-8 -c >> out.txt 2>/dev/null || head -c 1500 b.txt >> out.txt
            echo >> out.txt
          done
          git config --global user.name bot; git config --global user.email bot@users.noreply.github.com
          git init -q r && cd r && cp ../out.txt . && git add out.txt && git commit -qm probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:probe
