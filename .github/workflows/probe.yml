name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe_out.txt 2>&1
          python3 - <<'PY'
          import urllib.request, json, subprocess
          for ua in ["curl/8.5.0", "python-urllib/3.12", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"]:
              try:
                  t = urllib.request.urlopen(urllib.request.Request("https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2", headers={"User-Agent": ua}), timeout=40).read()
                  print("FRED", ua, "OK", len(t), t[-60:])
              except Exception as e:
                  print("FRED", ua, "FAIL", e)
          H = {"User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", "Referer": "https://m.stock.naver.com/"}
          d = json.loads(urllib.request.urlopen(urllib.request.Request("https://m.stock.naver.com/api/stock/005930/integration", headers=H), timeout=30).read())
          print("DEAL", json.dumps(d.get("dealTrendInfos"), ensure_ascii=False)[:1500])
          for u in ["https://m.stock.naver.com/api/index/KOSPI/trend?pageSize=30&page=1", "https://m.stock.naver.com/api/index/KOSPI/investorTrend?pageSize=30", "https://m.stock.naver.com/api/index/KOSPI/trend/list?pageSize=30", "https://m.stock.naver.com/api/index/KOSPI/dealTrend?pageSize=30"]:
              try:
                  t = urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30).read().decode()
                  print("TRY", u, t[:400])
              except Exception as e:
                  print("TRY", u, "FAIL", e)
          PY
      - run: |
          mkdir -p archive/x && mv probe_out.txt archive/x/probe.txt
          git config user.name bot; git config user.email bot@x
          git add archive/x/probe.txt; git commit -qm probe; git pull --rebase -q; git push -q
