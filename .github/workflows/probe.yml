name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          O="https://chkchp0702-spec.github.io"
          for u in "https://qt.gtimg.cn/q=us.DJI" "https://qt.gtimg.cn/q=us.INX" "https://qt.gtimg.cn/q=us.IXIC" "https://qt.gtimg.cn/q=jpN225" "https://qt.gtimg.cn/q=krKOSPI" "https://qt.gtimg.cn/q=hkHSI" "https://web.ifzq.gtimg.cn/appstock/app/minute/query?code=us.INX" "https://smartbox.gtimg.cn/s3/?v=2&q=KOSPI&t=all" "https://smartbox.gtimg.cn/s3/?v=2&q=N225&t=all" "https://smartbox.gtimg.cn/s3/?v=2&q=日经&t=all" "https://push2.eastmoney.com/api/qt/stock/get?secid=100.KS11&fields=f43,f57,f58,f170&cb=x" "https://push2his.eastmoney.com/api/qt/stock/trends2/get?secid=100.KS11&fields1=f1&fields2=f51,f53&ndays=1&cb=x"; do
            echo "=== $u" >> out.txt
            rm -f h.txt b.txt; touch h.txt b.txt; curl -s -m 15 -D h.txt -o b.txt -H "Origin: $O" -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" "$u"
            head -1 h.txt >> out.txt; grep -i "access-control-allow-origin\|content-type\|^location" h.txt >> out.txt
            head -c 600 b.txt | iconv -f gbk -t utf-8 -c >> out.txt 2>/dev/null || head -c 600 b.txt >> out.txt
            echo >> out.txt
          done
          git config --global user.name bot; git config --global user.email bot@users.noreply.github.com
          git init -q r && cd r && cp ../out.txt . && git add out.txt && git commit -qm probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:probe
