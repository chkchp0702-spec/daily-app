name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          O="https://chkchp0702-spec.github.io"
          for u in \
            "https://qt.gtimg.cn/q=sh000001,sz399001,sh000688,hkHSCEI,usDJI,us.DJI,usINX,us.INX,usIXIC,us.IXIC,jpN225" \
            "https://web.ifzq.gtimg.cn/appstock/app/minute/query?_var=x&code=us.DJI" \
            "https://web.ifzq.gtimg.cn/appstock/app/minute/query?_var=x&code=hkHSCEI" \
            "https://web.ifzq.gtimg.cn/appstock/app/minute/query?_var=x&code=sh000688" \
            "https://polling.finance.naver.com/api/realtime/domestic/index/KOSPI" \
            "https://m.stock.naver.com/api/index/KOSPI/basic" \
            "https://api.stock.naver.com/chart/domestic/index/KOSPI?periodType=dayCandle" \
            "https://polling.finance.naver.com/api/realtime/worldstock/index/.N225" \
            "https://polling.finance.naver.com/api/realtime/worldstock/index/.DJI" \
            "https://polling.finance.naver.com/api/realtime/worldstock/index/.HSCE" \
            "https://api.stock.naver.com/index/.N225/basic" \
            "https://query1.finance.yahoo.com/v8/finance/chart/%5EKS11?interval=5m&range=1d" \
            "https://query2.finance.yahoo.com/v8/finance/chart/%5EN225?interval=5m&range=1d" ; do
            echo "=== $u" >> out.txt
            rm -f h.txt b.txt; touch h.txt b.txt; curl -s -m 15 -D h.txt -o b.txt -H "Origin: $O" -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" "$u"
            head -1 h.txt >> out.txt; grep -i "access-control-allow-origin\|content-type" h.txt >> out.txt
            head -c 400 b.txt | iconv -f gbk -t utf-8 -c >> out.txt 2>/dev/null || head -c 400 b.txt >> out.txt
            echo >> out.txt
          done
          git config --global user.name bot; git config --global user.email bot@users.noreply.github.com
          git init -q r && cd r && cp ../out.txt . && git add out.txt && git commit -qm probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:probe
