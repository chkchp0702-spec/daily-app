name: probe_mirae
on:
  workflow_dispatch:
    inputs:
      script: {default: "probe/mirae/p14.py"}
      args: {default: ""}
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium >/dev/null
      - run: python ${{ github.event.inputs.script }} ${{ github.event.inputs.args }} || true
      - run: bash scripts/push.sh "probe mirae" probe/mirae/out
