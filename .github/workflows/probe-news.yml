name: probe-news
# 뉴스 원천 점검 (손으로만) — 결과는 probe 브랜치 out.txt
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git clone -q --depth 1 https://github.com/chkchp0702-spec/stock-onepager _src/stock-onepager
          pip install -q yfinance pandas
          git clone -q --depth 1 -b opdata https://github.com/${{ github.repository }} opdata
          python3 - <<'PY' > out.txt 2>&1
          import json, glob, os, sys, time, urllib.request, urllib.parse
          sys.path.insert(0, "_src/stock-onepager"); sys.path.insert(0, "opdb")
          from common import fname
          from onepager import data as D
          meta = json.load(open("opdata/meta.json")); names = json.load(open("opdata/names_ko.json", encoding="utf-8"))
          have = {os.path.basename(f)[:-5] for f in glob.glob("opdata/n/*.json")}
          import random; random.seed(7)
          miss = [s for s, v in meta.items() if len(v) <= 4 and fname(s) not in have]
          pick = random.sample(miss, 16)
          def get(url, h=None):
              req = urllib.request.Request(url, headers=h or {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300]
              except Exception as e:
                  return -1, repr(e).encode()[:300]
          import yfinance as yf
          from collections import Counter
          for s in pick:
              disp, mkt, _, ln = meta[s][:4]
              base = (ln or disp)
              ge = "https://news.google.com/rss/search?" + urllib.parse.urlencode({"q": '"%s" when:30d' % base, "hl": "en-US", "gl": "US", "ceid": "US:en"})
              st, b = get(ge, {"User-Agent": "Mozilla/5.0"}); n1 = b.count(b"<item>")
              ge2 = "https://news.google.com/rss/search?" + urllib.parse.urlencode({"q": base + " stock when:30d", "hl": "en-US", "gl": "US", "ceid": "US:en"})
              st2, b2 = get(ge2, {"User-Agent": "Mozilla/5.0"}); n2 = b2.count(b"<item>")
              bu = "https://www.bing.com/news/search?" + urllib.parse.urlencode({"q": base, "format": "rss"})
              st3, b3 = get(bu); n3 = b3.count(b"<item>")
              print(f"{s} [{mkt}] {base!r} g_en_quoted={st}:{n1} g_en_stock={st2}:{n2} bing_en={st3}:{n3}", flush=True)
              time.sleep(1)
          c = Counter(); t0 = time.time()
          for i, s in enumerate(miss[100:190]):
              disp, mkt, _, ln = meta[s][:4]
              q = (names.get(s) if mkt != "KR" else disp) or ln or disp
              gu = "https://news.google.com/rss/search?" + urllib.parse.urlencode({"q": q + " 주가 when:30d", "hl": "ko", "gl": "KR", "ceid": "KR:ko"})
              st, b = get(gu, {"User-Agent": "Mozilla/5.0"})
              c[st] += 1
              if i % 15 == 0: print('  h', i, dict(c), round(time.time() - t0), flush=True)
              if st != 200 and c[st] <= 2: print("  fail", i, st, b[:200])
              time.sleep(1.2)
          print("hammer", dict(c), round(time.time() - t0), flush=True)
          PY
          cat out.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -q --orphan probe2; git rm -rq --cached . ; git add out.txt; git commit -qm probe-news; git push -q -f origin probe2:probe
