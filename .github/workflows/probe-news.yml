name: probe-news
# 뉴스 원천 점검 (손으로만) — 결과는 probe 브랜치 out.txt
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git clone -q --depth 1 https://github.com/chkchp0702-spec/stock-onepager _src/stock-onepager
          pip install -q yfinance pandas
          git clone -q --depth 1 -b opdata https://github.com/${{ github.repository }} opdata
          python3 - <<'PY' > out.txt 2>&1
          import json, glob, os, sys, time, urllib.request, urllib.parse
          sys.path.insert(0, "_src/stock-onepager"); sys.path.insert(0, "opdb")
          from common import fname
          from onepager import data as D
          meta = json.load(open("opdata/meta.json")); names = json.load(open("opdata/names_ko.json", encoding="utf-8"))
          have = {os.path.basename(f)[:-5] for f in glob.glob("opdata/n/*.json")}
          import random; random.seed(7)
          miss = [s for s, v in meta.items() if len(v) <= 4 and fname(s) not in have]
          pick = random.sample(miss, 24)
          def get(url, h=None):
              req = urllib.request.Request(url, headers=h or {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300]
              except Exception as e:
                  return -1, repr(e).encode()[:300]
          import yfinance as yf
          for s in pick:
              disp, mkt, _, ln = meta[s][:4]
              ko = names.get(s) if mkt != "KR" else disp
              q = (ko or ln or disp) + " 주가"
              gu = "https://news.google.com/rss/search?" + urllib.parse.urlencode({"q": q + " when:30d", "hl": "ko", "gl": "KR", "ceid": "KR:ko"})
              st, b = get(gu, {"User-Agent": "Mozilla/5.0"})
              gn = b.count(b"<item>")
              gu2 = "https://news.google.com/rss/search?" + urllib.parse.urlencode({"q": q, "hl": "ko", "gl": "KR", "ceid": "KR:ko"})
              st2, b2 = get(gu2, {"User-Agent": "Mozilla/5.0"}); gn2 = b2.count(b"<item>")
              bu = "https://www.bing.com/news/search?" + urllib.parse.urlencode({"q": q, "format": "rss", "setlang": "ko", "cc": "KR"})
              st3, b3 = get(bu); bn = b3.count(b"<item>")
              try:
                  yn = len(yf.Search(s, news_count=6, max_results=1).news or [])
              except Exception as e:
                  yn = "ERR " + repr(e)[:80]
              try:
                  yt = len(yf.Ticker(s).news or [])
              except Exception as e:
                  yt = "ERR " + repr(e)[:80]
              nv = ""
              if mkt == "KR":
                  st4, b4 = get("https://m.stock.naver.com/api/news/stock/%s?pageSize=6&page=1" % s.split(".")[0])
                  nv = f" naver={st4}:{len(b4)}B"
              print(f"{s} [{mkt}] q={q!r} google30d={st}:{gn} google={st2}:{gn2} bing={st3}:{bn} yfsearch={yn} yfticker={yt}{nv}", flush=True)
              if gn == 0: print("   g-head:", b[:160])
              time.sleep(1)
          PY
          cat out.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -q --orphan probe2; git rm -rq --cached . ; git add out.txt; git commit -qm probe-news; git push -q -f origin probe2:probe
