name: video
# 공식 npm 패키지(HyperFrames · Remotion)만 설치해서 조이 시험 영상을 렌더링. video 브랜치 push 때만 돈다(앱 main 과 분리).
on:
  push:
    branches: [video]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
      - name: 설치 확인
        run: |
          mkdir -p out
          { echo "node $(node -v)"; echo "hyperframes $(npx --yes hyperframes@latest --version 2>&1 | tail -1)";
            mkdir -p /tmp/rm && cd /tmp/rm && npm init -y >/dev/null && npm i -s remotion @remotion/cli >/dev/null 2>&1 && echo "remotion $(node -p "require('remotion/package.json').version")"; } | tee out/versions.txt
      - name: HyperFrames 검사·렌더
        working-directory: video/joey-test
        run: |
          npx --yes hyperframes@latest check --json > $GITHUB_WORKSPACE/out/hf_check.json 2>&1 || true
          npx --yes hyperframes@latest render --quality delivery --output $GITHUB_WORKSPACE/out/joey_hf.mp4 2>&1 | tee $GITHUB_WORKSPACE/out/hf_render.log
      - name: 결과 올리기 (video-out 브랜치)
        if: always()
        run: |
          cd out && git init -q -b video-out && git config user.name video-bot && git config user.email video-bot@users.noreply.github.com
          git add -A && git commit -qm "video out" && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} video-out
