name: diag
# 🔧 11/02 보내기 진단 모으기 — 앱이 ntfy 진단 주제(chkchp-ch-diag-p4k9)로 보낸 단계 기록을 archive/x/diag.json 에 저장 (손으로·자동 실행)
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: diag
  cancel-in-progress: false
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s "https://ntfy.sh/chkchp-ch-diag-p4k9/json?poll=1&since=12h" > /tmp/d.jsonl || true
          python3 - <<'PY'
          import json
          rows=[]
          for ln in open('/tmp/d.jsonl', encoding='utf-8'):
              try:
                  m=json.loads(ln)
              except Exception:
                  continue
              if m.get('event')!='message': continue
              try: b=json.loads(m.get('message') or '{}')
              except Exception: b={'raw': m.get('message')}
              b['t']=m.get('time'); rows.append(b)
          json.dump(rows[-200:], open('archive/x/diag.json','w',encoding='utf-8'), ensure_ascii=False, indent=0)
          print(len(rows))
          PY
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add archive/x/diag.json; git diff --cached --quiet && exit 0
          git commit -qm "diag $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*5)); done
