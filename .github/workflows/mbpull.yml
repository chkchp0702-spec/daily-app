name: mbpull
# 🧠 11/27 두뇌 재료 공백 메우기 — live.yml 이 안 도는 시간(평일 KST 18~22시 · 주말 낮)에도 30분마다 서버 자료를 archive/mb 로 받음
on:
  schedule:
    - cron: "13,43 9-12 * * 1-5"   # 평일 KST 18:13 ~ 21:43
    - cron: "13,43 * * * 0,6"      # 토·일 하루 종일 (KST 토 09시~월 09시)
    - cron: "13,43 22-23 * * *"    # 매일 KST 07:13~08:43 (live 아침 공백)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 서버 자료 받기
        run: bash tools/srv_pull.sh brain archive/mb || echo "두뇌 재료 받기 실패"
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          bash scripts/push.sh "mbpull $(TZ=Asia/Seoul date '+%F %H:%M')" archive/mb
