name: push-relay
# 🔔 앱 푸시 중계를 따로 켜기 (보통은 지킴이가 같이 돌림 — 지킴이가 빠졌을 때 예비)
on:
  workflow_dispatch:
    inputs:
      secs:
        description: "몇 초 동안"
        default: "18000"
permissions:
  contents: read
concurrency:
  group: push-relay
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            push/
            archive/x/push_keys.json
            archive/x/push_subs.json
      - run: pip install -q pywebpush cryptography
      - run: python3 push/relay.py ${{ github.event.inputs.secs }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
