name: probe_tmp
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas matplotlib
      - run: python probe/aapl_chart.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe/aapl.png probe/aapl_weekly.txt && git commit -m "probe aapl" && (git pull --rebase -q; git push -q) || true
