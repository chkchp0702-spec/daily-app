name: probe_tmp
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy lxml requests xlrd openpyxl
      - run: python probe/aaii2_bt.py | grep -E "^R |^[A-Z]{2} |AAII|TRY|CUR|Error|Trace"
