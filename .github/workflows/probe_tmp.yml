name: probe_tmp
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests yfinance pandas numpy holidays
      - run: python probe/ovr_bt.py
