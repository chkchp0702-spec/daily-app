name: probe_tmp
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy lxml scikit-learn
      - run: python probe/vvix_bt.py && cat probe/vvix_bt.json | head -c 1
