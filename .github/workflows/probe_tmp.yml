name: probe_tmp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy lxml requests html5lib
      - run: python probe/mega111_bt.py
      - run: bash scripts/push.sh "probe 111 mega earnings $(TZ=Asia/Seoul date '+%F %H:%M')" probe/mega111_bt.json
