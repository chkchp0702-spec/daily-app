name: probe_tmp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy lxml requests
      - run: python probe/ffut109b_bt.py
      - run: bash scripts/push.sh "🎲 probe #109b 외국인 선물 이력 채움 $(TZ=Asia/Seoul date '+%F %H:%M')" archive/x/ffut_hist.json probe/ffut109b_bt.json
