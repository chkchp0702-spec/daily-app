name: compassix
# 나침반 대표 지수 차트(1년 일봉)만 빠르게 새로 — opdata/compass.json 의 index 덮어쓰기
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: opdata
  cancel-in-progress: false
jobs:
  ix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas
      - run: git clone -q --depth 1 -b opdata "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" opdata
      - run: python opdb/compass_ix.py --dest opdata
      - name: 저장
        run: |
          cd opdata
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add compass.json ix_log.txt
          git diff --cached --quiet || (git commit -qm "compass 지수 $(TZ=Asia/Seoul date '+%F %H:%M')" && git push -q origin HEAD:opdata)
      - name: 앱에 반영 (collect)
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" -d '{"ref":"main"}'
