name: probe-etf
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/etf_probe.py 418670 069500 381180
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add archive/x/probe_etf.json; git commit -qm "probe etf" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
