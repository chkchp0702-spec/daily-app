name: whale-lab
on:
  push:
    branches: [whale-lab]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy
      - run: mkdir -p out && python $(cat job.txt)
        continue-on-error: true
      - run: |
          cd out && git init -q -b whale-lab-out && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "lab $(date -u +%H:%M)" && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} whale-lab-out
