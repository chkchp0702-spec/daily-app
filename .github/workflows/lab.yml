name: whale-lab
on:
  push:
    branches: [whale-lab]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -U pandas numpy yfinance pykrx
      - name: 종목 목록(한 번)
        env: { KRX_ID: "${{ secrets.KRX_ID }}", KRX_PW: "${{ secrets.KRX_PW }}" }
        run: python -c "exec(open('fetch_krx.py').read().split('U = json.load')[0])" && ls -la uni.json
      - name: job
        timeout-minutes: 300
        continue-on-error: true
        env: { SHARD: "${{ matrix.shard }}", NSHARD: "8", KRX_ID: "${{ secrets.KRX_ID }}", KRX_PW: "${{ secrets.KRX_PW }}" }
        run: mkdir -p out && python $(cat job.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "part-${{ matrix.shard }}", path: out, retention-days: 3 }
  publish:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - run: |
          cd parts && ls -la && if ls kr_flow_*.csv >/dev/null 2>&1; then (head -1 kr_flow_0.csv; for f in kr_flow_*.csv; do tail -n +2 $f; done) | gzip > kr_flow.csv.gz && rm -f kr_flow_*.csv; fi
          if ls krx_flow_*.csv >/dev/null 2>&1; then (head -1 krx_flow_0.csv; for f in krx_flow_*.csv; do tail -n +2 $f; done) | gzip > krx_flow.csv.gz && rm -f krx_flow_*.csv; fi
          cat fetch_log_*.txt > fetch_log.txt 2>/dev/null || true
          git init -q -b whale-lab-out && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "lab $(date -u +%H:%M)" && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} whale-lab-out
