name: keeper
# ⏰ 지킴이: GitHub 예약 실행이 자주 빠져서, 하루 4교대(KST 04·10·16·22시)로 깨어 있으며
#    정해진 시각에 collect·live·watch·opprice·regime 을 직접 돌린다 (keeper.py).
#    교대마다 예약을 4번 걸어두고, 먼저 켜진 하나만 일한다.
on:
  schedule:
    - cron: "1,21,41 19 * * *"   # KST 04:01·04:21·04:41
    - cron: "11,41 20 * * *"     # KST 05:11·05:41 (예비)
    - cron: "1,21,41 1 * * *"    # KST 10:01·10:21·10:41
    - cron: "11 2 * * *"         # KST 11:11
    - cron: "1,21,41 7 * * *"    # KST 16:01·16:21·16:41
    - cron: "11 8 * * *"         # KST 17:11
    - cron: "1,21,41 13 * * *"   # KST 22:01·22:21·22:41
    - cron: "11 14 * * *"        # KST 23:11
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            keeper.py
            push/
            archive/x/push_keys.json
            archive/x/push_subs.json
      - name: 🔔 앱 푸시 준비
        continue-on-error: true
        run: pip install -q pywebpush cryptography
      - name: 지킴이 + 🔔 앱 푸시 중계(같이 깨어 있음)
        run: |
          if [ -f archive/x/push_keys.json ]; then (python3 push/relay.py 23000 > relay.log 2>&1 &) ; fi
          python3 keeper.py
          echo "---- 푸시 중계 기록"; tail -n 60 relay.log 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
