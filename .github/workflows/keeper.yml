name: keeper
# ⏰ 지킴이: GitHub 예약 실행이 자주 빠져서, 하루 4교대(KST 05·11·17·23시)로 깨어 있으며
#    정해진 시각에 collect·live·watch·opprice·regime 을 직접 돌린다 (keeper.py).
#    교대마다 예약을 4번 걸어두고, 먼저 켜진 하나만 일한다.
on:
  schedule:
    - cron: "1,21,51 20 * * *"   # KST 05:01·05:21·05:51
    - cron: "31 21 * * *"        # KST 06:31
    - cron: "1,21,51 2 * * *"    # KST 11:01·11:21·11:51
    - cron: "31 3 * * *"         # KST 12:31
    - cron: "1,21,51 8 * * *"    # KST 17:01·17:21·17:51
    - cron: "31 9 * * *"         # KST 18:31
    - cron: "1,21,51 14 * * *"   # KST 23:01·23:21·23:51
    - cron: "31 15 * * *"        # KST 00:31
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: keeper.py
      - run: python3 keeper.py
        env:
          GH_TOKEN: ${{ github.token }}
