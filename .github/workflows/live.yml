name: live
# 나침반 장중판: 평일 09:05 ~ 17:35 30분마다 (한국 = 네이버, 일본·중국·홍콩 = 야후)
on:
  schedule:
    - cron: "5,35 0-8 * * 1-5"   # KST 09:05 ~ 17:35 (한국·일본·중국·홍콩)
  workflow_dispatch:
    inputs:
      force:
        description: "시험 (장 시간이 아니어도 돌려서 *_test.json 에 쓰기)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 장중 나침반
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: |
          python live.py || echo "한국 실패"
          pip install -q yfinance pandas
          python live_world.py || echo "일본·중국·홍콩 실패"
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive/x/live_*.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "live $(TZ=Asia/Seoul date '+%F %H:%M')" && (git pull --rebase -q || git pull --rebase -q) && git push)
