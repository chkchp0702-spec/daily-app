name: live
# 나침반 장중판: 각 시장 장 시간에 10분마다 (한국 = 네이버, 일본·중국·홍콩·미국 = 야후)
#   아시아: KST 09:03 ~ 17:53  ·  미국: 뉴욕 09:30~16:00 = UTC 13:30~21:00 (서머타임과 무관하게 같은 UTC 범위 안)
on:
  schedule:
    - cron: "3-59/10 0-8 * * 1-5"    # KST 09:03 ~ 17:53 (한국·일본·중국·홍콩)
    - cron: "3-59/10 13-21 * * 1-5"  # KST 22:03 ~ 06:53 (미국, 장 시간 밖이면 바로 끝남)
  workflow_dispatch:
    inputs:
      force:
        description: "시험 (장 시간이 아니어도 돌려서 *_test.json 에 쓰기)"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 장중 나침반
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          H=$(date -u +%H)
          if [ "$H" -lt 12 ] || [ -n "$FORCE" ]; then python live.py || echo "한국 실패"; fi
          pip install -q yfinance pandas
          python live_world.py || echo "일본·중국·홍콩·미국 실패"
          python focus_live.py || echo "🎯 집중 장중 실패"
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive/x/live_*.json archive/x/focus_live.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "live $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done
          exit 1
      - name: 지킴이 살아 있나 (없으면 켬)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/keeper.yml/runs?status=in_progress&per_page=5" --jq '.total_count' || echo 1)
          Q=$(gh api "repos/${{ github.repository }}/actions/workflows/keeper.yml/runs?status=queued&per_page=5" --jq '.total_count' || echo 1)
          if [ "$N" = "0" ] && [ "$Q" = "0" ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/keeper.yml/dispatches" -f ref=main && echo "지킴이 켬"; else echo "지킴이 있음"; fi
