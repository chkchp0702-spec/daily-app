name: live
# 나침반 장중판: 각 시장 장 시간에 10분마다 (한국 = 네이버, 일본·중국·홍콩·미국 = 야후)
#   아시아: KST 09:03 ~ 17:53  ·  미국: 뉴욕 09:30~16:00 = UTC 13:30~21:00 (서머타임과 무관하게 같은 UTC 범위 안)
on:
  schedule:
    - cron: "3-59/10 0-8 * * 1-5"    # KST 09:03 ~ 17:53 (한국·일본·중국·홍콩)
    - cron: "3-59/10 13-21 * * 1-5"  # KST 22:03 ~ 06:53 (미국, 장 시간 밖이면 바로 끝남)
  workflow_dispatch:
    inputs:
      force:
        description: "시험 (장 시간이 아니어도 돌려서 *_test.json 에 쓰기)"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 장중 나침반
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          H=$(date -u +%H)
          if [ "$H" -lt 12 ] || [ -n "$FORCE" ]; then python live.py || echo "한국 실패"; fi
          pip install -q yfinance pandas
          python live_world.py || echo "일본·중국·홍콩·미국 실패"
          # 🌏 10/28: 세계 지수·미국 선물·유가·금·환율(live_us_pre) — uspre.yml 예약이 실제론 5시간에 한 번꼴만 돌아 여기서 10분마다 같이
          python live_us_pre.py || echo "🌙 세계·선물 실패"
          python focus_live.py || echo "🎯 집중 장중 실패"
          python cup_live.py || echo "☕ 돌파 임박 장중 실패"
          # 🧭 10/15: 나침반 지수·국면에 방금 값 덧입히기 (아침 한 번 받은 지수에 머물러 「−5% 횡보장」이 나왔음)
          CP=$(ls archive/sector/*/compass.json | sort | tail -1); echo "$CP" > /tmp/cp.txt
          python opdb/ixlive.py "$CP" archive/x || echo "나침반 덧입히기 실패"
          # 👔 10/28 PB 한 장 — 장중 매시간(각 시 첫 실행) 갱신 · 알림은 아침 한 번만(brief.yml)
          # 🩺 10/30: 15:40 장 끝 ~ 16:04 첫 갱신 사이 「15:03 장중 코스피 −4.8%」가 마감(−3.5%) 뒤에도 남던 것 → 15:41~15:59 에도 한 번 더(마감판)
          M=$(TZ=Asia/Seoul date +%M); HM=$(TZ=Asia/Seoul date +%H%M); if [ "$M" -lt 15 ] || { [ "$HM" -ge 1541 ] && [ "$HM" -le 1559 ]; } || [ -n "$FORCE" ]; then python pbbrief.py || echo "PB 한 장 실패"; python proposal.py || echo "📝 제안서 기본폼 실패"; fi
          python wl_live.py || echo "⭐ 관심종목 시세 실패"   # 10/28 고객 한 장용 실시간 시세·뉴스
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          bash scripts/push.sh "live $(TZ=Asia/Seoul date '+%F %H:%M')" archive/x/live_*.json archive/x/focus_live.json archive/x/cup_live.json archive/x/pbbrief.json archive/x/proposal.json archive/x/wl_live.json "$(cat /tmp/cp.txt)"
      - name: 지킴이 살아 있나 (없으면 켬)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/keeper.yml/runs?status=in_progress&per_page=5" --jq '.total_count' || echo 1)
          Q=$(gh api "repos/${{ github.repository }}/actions/workflows/keeper.yml/runs?status=queued&per_page=5" --jq '.total_count' || echo 1)
          if [ "$N" = "0" ] && [ "$Q" = "0" ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/keeper.yml/dispatches" -f ref=main && echo "지킴이 켬"; else echo "지킴이 있음"; fi
