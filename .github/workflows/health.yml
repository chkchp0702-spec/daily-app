name: health

# 🩺 앱 건강검진 (10/10 앱 업그레이드 ⑩) — 매일 16:30 KST · 일요일 08:05 KST 「이번 주 고친 것」
on:
  schedule:
    - cron: "30 7 * * *"     # 16:30 KST (17:47 자가 업그레이드 전에)
    - cron: "5 23 * * 6"     # 일요일 08:05 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python health.py
      - name: commit
        run: |
          git config user.name "health-bot"
          git config user.email "health-bot@users.noreply.github.com"
          git add archive/x/health.json
          git diff --cached --quiet || git commit -m "health $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
