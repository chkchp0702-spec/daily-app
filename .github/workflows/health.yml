name: health

# 🩺 앱 건강검진 (10/10 앱 업그레이드 ⑩) — 매일 16:30 KST · 일요일 08:05 KST 「이번 주 고친 것」
on:
  schedule:
    - cron: "52 6 * * *"     # 15:52 KST (10/29 깊은 검진 35분 → 16:47 자가 업그레이드 전에 끝나게)
    - cron: "5 23 * * 6"     # 일요일 08:05 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: false   # 10/29 긴 검진을 두 번째 실행이 끊지 않게

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python health.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: commit
        run: |
          git config user.name "health-bot"
          git config user.email "health-bot@users.noreply.github.com"
          bash scripts/push.sh "health $(TZ=Asia/Seoul date '+%m/%d %H:%M')" archive/x/health.json
      # 🩺 10/29 탭마다 화면 사진 → health-shots 브랜치(매번 새로 덮음 · main 기록은 안 늘어남). 자가 업그레이드가 열어 눈으로 본다
      - name: shots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q -b health-shots && git config user.name health-bot && git config user.email health-bot@users.noreply.github.com
          git add -A && git commit -qm "health shots $(TZ=Asia/Seoul date '+%m/%d %H:%M')" && \
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:health-shots
