name: probe_prob_tmp
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pykrx pandas numpy yfinance scikit-learn requests holidays
      - run: python probe/krxacct_bt.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 저장
        if: always()
        run: bash scripts/push.sh "probe krx 공매도 $(TZ=Asia/Seoul date '+%F %H:%M')" archive/x/kr_short.csv probe/krxacct_bt.json
