name: probe_prob_tmp
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt 2>/dev/null || true; pip install -q yfinance pandas numpy requests scikit-learn holidays
      - run: python probe/cpivol_bt.py
