name: watch
# 매시간 가볍게: 관심종목 동기화 · 목표가/손절가 도달 알림 · 갭 첫 30분 확인
on:
  schedule:
    - cron: "35 0-6 * * 1-5"    # KST 09:35 ~ 15:35 (한국 장중)
    - cron: "47 13-20 * * 1-5"  # KST 22:47 ~ 05:47 (미국 장중)
    - cron: "17 11 * * *"       # KST 20:17 (매일 동기화)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 감시
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          pip install -q yfinance pandas
          python watch.py || echo "watch 일부 실패"
      - name: 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive/x
          git diff --cached --quiet || (git commit -m "watch $(TZ=Asia/Seoul date '+%F %H:%M')" && git pull --rebase -q && git push)
