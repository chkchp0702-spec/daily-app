name: krx-check
# 🔑 11/12 KRX 비밀값이 이 저장소에 있는지 길이만 확인 (값은 안 찍음) — 확인 뒤 지움
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "KRX_ID 길이: ${#KRX_ID} · KRX_PW 길이: ${#KRX_PW}"
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
