name: explain
# 🎬 조이 설명 영상: 실제 앱 화면 찍기(Playwright) → HyperFrames 렌더 → video-out 브랜치에 결과
# video 브랜치에 push 할 때만 돈다(앱 main 과 분리). 공식 npm 패키지(hyperframes)만 씀.
on:
  push:
    branches: [video]
permissions:
  contents: write
concurrency: { group: explain, cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 도구
        run: |
          pip install -q playwright pillow && python -m playwright install --with-deps chromium > /dev/null
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-color-emoji > /dev/null
          npx --yes hyperframes@latest --version
      - name: 앱 화면 찍기
        run: python explain/capture.py
      - name: 영상 만들기
        run: python explain/build.py
      - name: 결과 올리기 (video-out)
        if: always()
        run: |
          mkdir -p pub && cp explain/out/* pub/ 2>/dev/null || true
          cp explain/cap/log.txt pub/cap_log.txt 2>/dev/null || true
          for f in explain/cap/*.png; do [ -f "$f" ] && python -c "from PIL import Image;import sys;im=Image.open('$f');im.thumbnail((390,99999));im.convert('RGB').save('pub/cap_'+'$f'.split('/')[-1][:-4]+'.jpg',quality=70)"; done
          cd pub && git init -q -b video-out && git config user.name video-bot && git config user.email video-bot@users.noreply.github.com
          git add -A && git commit -qm "explain out" && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} video-out
