name: products
# 🛍️ 상품 — 미래에셋증권 판매 채권(원화·미국채·호주국채)·펀드·ELS 를 모아 archive/x/products.json archive/x/fund_hold.json archive/x/pv_kofia.json archive/x/pv_nav.json archive/x/pv_pub.json
on:
  schedule:
    - cron: "41 22 * * 0-4"   # KST 07:41 (평일 아침)
    - cron: "47 0 * * 1-5"    # KST 09:47 (장 시작 뒤 채권 금리·전날 펀드 기준가)
    - cron: "17 3 * * 1-5"    # KST 12:17 (ELS 청약 금액·장중 채권 금리)
    - cron: "7 6 * * 1-5"     # KST 15:07 (장 마감 직전 금리·지수)
    - cron: "37 8 * * 1-5"    # KST 17:37 (마감 뒤 펀드 기준가·다음 날 미국채 판매정보 전)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: products
  cancel-in-progress: false
jobs:
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests yfinance pandas
      - name: 상품 모으기
        run: python products.py
      - name: 🎬 ELS 과거 재생 (10/19 A10/19-1) · 🎛 설계기 일봉 (10/20, 7일마다)
        run: pip install -q numpy && python els_replay.py || echo "replay skipped"
      - name: 💼 포트 설계기 · 🧲 닮은 날 일봉 (10/21 A10/21-1·2)
        run: python port_px.py || echo "port_px skipped"
      - name: 저장
        run: bash scripts/push.sh "products $(TZ=Asia/Seoul date '+%F %H:%M')" archive/x/products.json archive/x/fund_hold.json archive/x/pv_kofia.json archive/x/pv_nav.json archive/x/pv_pub.json archive/x/els_replay.json archive/x/els_px archive/x/port_px
