<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="assets/gsap-3.14.2.min.js"></script>
<style>
  @font-face { font-family: "JoeyKR"; font-weight: 700; src: url("assets/fonts/joey-kr-700.woff") format("woff"); }
  @font-face { font-family: "JoeyKR"; font-weight: 900; src: url("assets/fonts/joey-kr-900.woff") format("woff"); }
  :root { --navy: #1f3478; --navy2: #3553a8; --up: #ff5a5f; --dn: #5aa9ff; --ink: #0f1b3d; --paper: #fffaf2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
  body { font-family: "JoeyKR", sans-serif; color: #fff; }
  #root { position: absolute; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; background: linear-gradient(170deg, #3b5bb5 0%, #22397f 55%, #15265a 100%); }
  #rain { position: absolute; left: -200px; top: -1920px; width: 1480px; height: 3840px;
    background-image: repeating-linear-gradient(105deg, rgba(255,255,255,0) 0 46px, rgba(255,255,255,.10) 46px 49px); }
  .scene { position: absolute; inset: 0; }

  /* 1. 인사 */
  #s1-card { position: absolute; left: 240px; top: 330px; width: 600px; height: 800px; border-radius: 56px; overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,.35); background: #f4e7cf url("assets/kid_umb.jpg") center / cover no-repeat; }
  #s1-date { position: absolute; left: 0; right: 0; top: 1230px; text-align: center; font-size: 92px; font-weight: 900; letter-spacing: -2px; }
  #s1-sub { position: absolute; left: 0; right: 0; top: 1370px; text-align: center; font-size: 52px; font-weight: 700; opacity: .9; }
  #s1-chip { position: absolute; left: 50%; top: 1480px; width: 360px; margin-left: -180px; padding: 22px 0; border-radius: 80px; text-align: center;
    background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.35); font-size: 50px; font-weight: 900; }

  /* 2. 지수 */
  #s2-lab { position: absolute; left: 110px; top: 300px; font-size: 60px; font-weight: 700; opacity: .9; }
  #s2-big { position: absolute; left: 100px; top: 380px; font-size: 230px; font-weight: 900; letter-spacing: -8px; color: var(--dn); }
  #s2-last { position: absolute; left: 112px; top: 660px; font-size: 56px; font-weight: 700; opacity: .85; }
  #s2-kq { position: absolute; left: 110px; top: 800px; width: 860px; padding: 40px 48px; border-radius: 40px; background: rgba(255,255,255,.12);
    font-size: 56px; font-weight: 700; display: flex; justify-content: space-between; }
  #s2-kq b { color: var(--dn); font-weight: 900; }
  #s2-brlab { position: absolute; left: 110px; top: 1090px; font-size: 52px; font-weight: 700; }
  #s2-bar { position: absolute; left: 110px; top: 1180px; width: 860px; height: 90px; border-radius: 45px; overflow: hidden; background: rgba(255,255,255,.12); }
  #s2-up { position: absolute; left: 0; top: 0; height: 90px; width: 145px; background: var(--up); transform-origin: left center; }
  #s2-dn { position: absolute; right: 0; top: 0; height: 90px; width: 660px; background: var(--dn); transform-origin: right center; }
  #s2-nums { position: absolute; left: 110px; top: 1300px; width: 860px; display: flex; justify-content: space-between; font-size: 54px; font-weight: 900; }
  #s2-nums .u { color: var(--up); } #s2-nums .d { color: var(--dn); }
  #s2-note { position: absolute; left: 110px; right: 110px; top: 1480px; font-size: 50px; font-weight: 700; line-height: 1.45; opacity: .92; }

  /* 3. 업종 */
  #s3-lab { position: absolute; left: 110px; top: 250px; font-size: 76px; font-weight: 900; letter-spacing: -2px; }
  .row { position: absolute; left: 110px; width: 860px; height: 150px; }
  .row .nm { position: absolute; left: 0; top: 0; font-size: 50px; font-weight: 700; }
  .row .tr { position: absolute; left: 0; top: 78px; width: 860px; height: 54px; border-radius: 27px; background: rgba(255,255,255,.10); }
  .row .fl { position: absolute; top: 0; height: 54px; border-radius: 27px; transform-origin: left center; }
  .row .v { position: absolute; right: 0; top: 0; font-size: 52px; font-weight: 900; }
  .up .fl { background: var(--up); } .up .v { color: var(--up); }
  .dn .fl { background: var(--dn); } .dn .v { color: var(--dn); }
  #s3-r1 { top: 420px; } #s3-r2 { top: 600px; } #s3-r3 { top: 780px; } #s3-r4 { top: 960px; }
  #s3-kid { position: absolute; left: 90px; top: 1240px; width: 330px; height: 440px; border-radius: 40px; overflow: hidden;
    background: #f4e7cf url("assets/kid_umb.jpg") center / cover no-repeat; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
  #s3-bub { position: absolute; left: 470px; top: 1290px; width: 520px; padding: 40px 44px; border-radius: 44px; background: var(--paper); color: var(--ink);
    font-size: 50px; font-weight: 900; line-height: 1.4; }
  #s3-brand { position: absolute; left: 0; right: 0; top: 1760px; text-align: center; font-size: 40px; font-weight: 700; opacity: .75; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
  <div id="bg"><div id="rain"></div></div>

  <div id="s1" class="scene clip" data-start="0" data-duration="4.4" data-track-index="1">
    <div id="s1-card"></div>
    <div id="s1-date">10월 26일 장 마감</div>
    <div id="s1-sub">조이가 오늘 장을 정리해 줄게요</div>
    <div id="s1-chip">오늘 날씨 · 비</div>
  </div>

  <div id="s2" class="scene clip" data-start="4.4" data-duration="5.2" data-track-index="2">
    <div id="s2-lab">코스피</div>
    <div id="s2-big">−0.00%</div>
    <div id="s2-last">5,469.47 마감</div>
    <div id="s2-kq"><span>코스닥</span><b>−3.26%</b></div>
    <div id="s2-brlab">오른 종목 vs 내린 종목</div>
    <div id="s2-bar"><div id="s2-up"></div><div id="s2-dn"></div></div>
    <div id="s2-nums"><span class="u">434 오름</span><span class="d">1,985 내림</span></div>
    <div id="s2-note">열 종목 중 여덟 개가 내렸어요.<br>코스닥이 더 많이 빠졌어요.</div>
  </div>

  <div id="s3" class="scene clip" data-start="9.6" data-duration="5.4" data-track-index="3">
    <div id="s3-lab">오늘의 업종</div>
    <div id="s3-r1" class="row up"><div class="nm">의료기기·서비스</div><div class="v">+1.02%</div><div class="tr"><div class="fl" style="left:0;width:132px"></div></div></div>
    <div id="s3-r2" class="row dn"><div class="nm">반도체</div><div class="v">−0.58%</div><div class="tr"><div class="fl" style="left:0;width:75px"></div></div></div>
    <div id="s3-r3" class="row dn"><div class="nm">방산·항공우주</div><div class="v">−4.71%</div><div class="tr"><div class="fl" style="left:0;width:611px"></div></div></div>
    <div id="s3-r4" class="row dn"><div class="nm">신재생·태양광</div><div class="v">−6.63%</div><div class="tr"><div class="fl" style="left:0;width:860px"></div></div></div>
    <div id="s3-kid"></div>
    <div id="s3-bub">비 오는 날엔<br>서두르지 말아요</div>
    <div id="s3-brand">CH Investing · 참고용 자료예요</div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // 배경 비 (계속 흐름)
  tl.fromTo("#rain", { y: 0 }, { y: 1920, duration: 15, ease: "none" }, 0);

  // 1. 인사
  tl.fromTo("#s1-card", { scale: 0.9, y: 30 }, { scale: 1, y: 0, duration: 0.8, ease: "back.out(1.6)" }, 0);
  tl.fromTo("#s1-date", { y: 30 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0);
  tl.fromTo("#s1-sub", { opacity: 0.9, y: 30 }, { opacity: 0.9, y: 0, duration: 0.6, ease: "power3.out" }, 0);
  tl.fromTo("#s1-chip", { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.2);
  tl.fromTo("#s1-card", { rotation: 0 }, { rotation: -3, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.0);
  tl.fromTo("#s1-card, #s1-date, #s1-sub, #s1-chip", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, 4.05);

  // 2. 지수
  const S2 = 4.4, k = { v: 0 };
  tl.fromTo("#s2-lab", { opacity: 0, x: -40 }, { opacity: 0.9, x: 0, duration: 0.4, ease: "power3.out" }, S2 + 0.1);
  tl.fromTo("#s2-big", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, S2 + 0.2);
  tl.fromTo(k, { v: 0 }, { v: -1.46, duration: 1.1, ease: "power2.out",
    onUpdate: () => { document.getElementById("s2-big").textContent = "−" + Math.abs(k.v).toFixed(2) + "%"; } }, S2 + 0.25);
  tl.fromTo("#s2-last", { opacity: 0 }, { opacity: 0.85, duration: 0.4 }, S2 + 0.9);
  tl.fromTo("#s2-kq", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, S2 + 1.3);
  tl.fromTo("#s2-brlab, #s2-bar", { opacity: 0 }, { opacity: 1, duration: 0.35 }, S2 + 1.9);
  tl.fromTo("#s2-up", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, S2 + 2.1);
  tl.fromTo("#s2-dn", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, S2 + 2.1);
  tl.fromTo("#s2-nums", { opacity: 0 }, { opacity: 1, duration: 0.4 }, S2 + 2.6);
  tl.fromTo("#s2-note", { opacity: 0, y: 30 }, { opacity: 0.92, y: 0, duration: 0.5, ease: "power3.out" }, S2 + 3.1);
  tl.fromTo("#s2-lab, #s2-big, #s2-last, #s2-kq, #s2-brlab, #s2-bar, #s2-nums, #s2-note", { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, S2 + 4.85);

  // 3. 업종
  const S3 = 9.6;
  tl.fromTo("#s3-lab", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, S3 + 0.1);
  ["#s3-r1", "#s3-r2", "#s3-r3", "#s3-r4"].forEach((id, i) => {
    tl.fromTo(id, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, S3 + 0.4 + i * 0.25);
    tl.fromTo(id + " .fl", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, S3 + 0.55 + i * 0.25);
  });
  tl.fromTo("#s3-kid", { opacity: 0, scale: 0.7, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.7)" }, S3 + 1.9);
  tl.fromTo("#s3-bub", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, S3 + 2.3);
  tl.fromTo("#s3-brand", { opacity: 0 }, { opacity: 0.75, duration: 0.5 }, S3 + 3.0);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
