<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매일 자료</title>
</head>
<body style="font-family:sans-serif;padding:20px">
<h1>오늘의 자료</h1>
<p id="msg">불러오는 중…</p>
<p id="time" style="color:gray"></p>
<script>
fetch("data.json?" + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById("msg").textContent = d.message;
    document.getElementById("time").textContent = "업데이트: " + d.updated;
  });

var userName = localStorage.getItem("userName");
if (!userName) {
  userName = (prompt("처음 한 번만 이름을 입력해 주세요") || "").trim() || "이름없음";
  localStorage.setItem("userName", userName);
}
var ua = navigator.userAgent;
var device = /iPhone|iPad/.test(ua) ? "아이폰" : /Android/.test(ua) ? "안드로이드" : "PC";
fetch("https://ntfy.sh/chkchp-daily-5821", {
  method: "POST",
  body: userName + " 님이 앱을 열었어요 (" + device + ")"
});
</script>
</body>
</html>
