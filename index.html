<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CH Investing</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CH Investing">
<meta name="theme-color" content="#0b0f17">
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="icon" href="icon.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0b0f17; --panel:#121826; --panel2:#182033; --line:#232c40;
  --text:#e8ecf4; --sub:#8a94a8; --dim:#5d667a;
  --up:#e66767; --down:#3987e5; --acc:#7c9cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;font-size:15px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
/* 헤더 */
header{position:sticky;top:0;z-index:10;background:rgba(11,15,23,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:calc(env(safe-area-inset-top) + 12px) 0 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 10px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}
.brand span{color:var(--acc)}
.stamp{font-size:11px;color:var(--dim);text-align:right}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 12px 12px}
.tabs::-webkit-scrollbar,.dates::-webkit-scrollbar{display:none}
.tab{min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:14px;
  padding:7px 2px 6px;font:inherit;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:.2s;letter-spacing:-.3px;white-space:nowrap}
.tab .ic{font-size:21px;line-height:1.15}
.tab .tn{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{background:color-mix(in srgb,var(--c) 22%,var(--panel));border-color:var(--c);color:var(--text);box-shadow:0 0 0 1px var(--c) inset}
/* 본문 */
main{padding:16px;max-width:760px;margin:0 auto}
.hero{border-radius:20px;padding:18px;margin-bottom:14px;background:
  radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--c) 35%,transparent),transparent 60%),var(--panel);
  border:1px solid var(--line)}
.hero h1{margin:0;font-size:24px;letter-spacing:-.6px}
.hero p{margin:4px 0 0;color:var(--sub);font-size:13px}
.hero .meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--sub)}
.dates{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.date{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:12px;
  padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;text-align:center;line-height:1.2}
.date b{display:block;font-size:15px;color:var(--text)}
.date.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.date.on b{color:var(--c)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;overflow:hidden}
.card h3{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:5px 10px;border-radius:8px;background:var(--panel2);color:var(--text);text-decoration:none;border:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:48px 16px}
.empty .big{font-size:40px;margin-bottom:8px}
/* 텍스트 */
.txt{white-space:pre-wrap;font-size:14px;line-height:1.65;word-break:keep-all}
.md{font-size:14px;word-break:keep-all}
.md h1{font-size:20px}.md h2{font-size:17px;margin-top:22px;color:var(--c)}
.md table{border-collapse:collapse;width:100%;font-size:12px;display:block;overflow-x:auto}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.md th{color:var(--sub);font-weight:600}
.md img{max-width:100%;border-radius:10px}
/* PDF */
.pdf canvas{width:100%;display:block;border-radius:10px;margin-bottom:8px;background:#fff}
.loading{color:var(--dim);font-size:13px;padding:20px 0;text-align:center}
iframe.rep{width:100%;border:0;border-radius:12px;background:#fff;min-height:70vh}
/* 종목 카드 */
.list{display:grid;gap:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.st .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.st .nm{font-weight:700;font-size:16px;letter-spacing:-.3px}
.st .nm a{color:inherit;text-decoration:none}
.st .cd{color:var(--dim);font-size:12px;margin-left:4px;font-weight:400}
.st .tm{color:var(--sub);font-size:12px}
.pill{white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--sub)}
.pill.hot{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}
.pill.cool{background:color-mix(in srgb,var(--down) 22%,transparent);color:var(--down)}
.pill.c{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kv{background:var(--panel2);border-radius:10px;padding:7px 8px}
.kv small{display:block;color:var(--dim);font-size:11px}
.kv b{font-size:14px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}
.more{width:100%;margin-top:4px;padding:12px;border-radius:14px;border:1px dashed var(--line);background:transparent;color:var(--sub);font:inherit}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum .kv{background:var(--panel);border:1px solid var(--line);padding:12px}
.sum .kv b{font-size:18px}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px}
.seg button.on{color:var(--text);border-color:var(--c)}
.reqrow{display:flex;gap:8px}
.reqrow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:10px 12px}
.reqrow button{flex:none;border:0;border-radius:12px;background:var(--c);color:#0b0f17;font:inherit;font-weight:700;padding:0 18px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.board .kv{padding:7px 6px}.board .kv b{display:block;font-size:13px;font-variant-numeric:tabular-nums}.board .kv small{font-size:10.5px}
.sug{display:grid;gap:4px;margin-top:6px}
.sug button{display:flex;align-items:baseline;gap:6px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:inherit;padding:10px 4px}
.sug small{color:var(--dim);font-size:12px;margin-left:auto}
.opl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.opb{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;text-align:left;line-height:1.25}
.opb small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.opb.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}

/* ===== 비주얼 (viz.js / views.js) ===== */
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:18px 2px 10px;letter-spacing:.2px}
.mut{color:var(--dim);font-weight:400;font-size:12px}
.note{color:var(--sub);font-size:12.5px;line-height:1.6;margin:10px 0 0;word-break:keep-all}
.sub2{font-size:12px;color:var(--sub);margin:14px 0 8px;font-weight:600}
.chip2{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--sub);white-space:nowrap;text-decoration:none;margin:2px 4px 2px 0}
.chip2.hot{background:color-mix(in srgb,var(--up) 20%,transparent);color:#ff9a9a}
.chip2.cool{background:color-mix(in srgb,var(--down) 22%,transparent);color:#8fb8ff}
.chip2.c{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.btn.op{font-size:11.5px;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,var(--panel2));border-color:transparent;white-space:nowrap}
.fold{display:block;width:100%;margin:10px 0;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font:inherit;font-size:14px;text-align:left}
.hero2{border-radius:20px;padding:18px;margin-bottom:12px;border:1px solid var(--line);
  background:radial-gradient(130% 120% at 0% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 60%),var(--panel)}
.hero2-k{font-size:12px;color:var(--sub);margin-bottom:8px}
.hero2-t{font-size:17px;line-height:1.6;font-weight:600;letter-spacing:-.3px;word-break:keep-all}
.hero2-t em{font-style:normal;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:4px;padding:0 3px}
.hero2-b{margin-top:12px}
.big-t{font-size:32px;font-weight:800;letter-spacing:-1px}
.kpis2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;position:relative;overflow:hidden}
.kp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.kp.kp-up::before{background:var(--up)}.kp.kp-dn::before{background:var(--down)}
.kp small{display:block;color:var(--sub);font-size:11.5px}
.kp b{display:block;font-size:21px;letter-spacing:-.5px;margin:2px 0}
.kp span{font-size:11.5px;color:var(--sub)}
.kp p{margin:8px 0 0;font-size:12px;color:var(--sub);line-height:1.5;word-break:keep-all}
.stack{display:flex;gap:2px;height:30px;border-radius:9px;overflow:hidden;margin-bottom:12px}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.scn{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.scn i{width:10px;height:10px;border-radius:3px;margin-top:5px}
.scn small{display:block;color:var(--sub);font-size:12px;margin-top:2px;word-break:keep-all}
.scn-v{text-align:right;white-space:nowrap}.scn-v b{font-size:17px}.scn-v span{display:block;font-size:11.5px;font-weight:700}
.conds{display:grid;gap:12px}
.cond-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:13.5px;margin-bottom:6px;word-break:keep-all}
.cond small{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}.cond small.then{color:var(--sub)}
.pg{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}.pg-f{height:100%;border-radius:99px}
.rs{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65}.rs li{margin:6px 0;word-break:keep-all}
.gr{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;word-break:keep-all}
.gr:first-child{border-top:0}.gr small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;line-height:1.5}
.gr-m{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--panel2);color:var(--sub)}
.gr-m.ok{background:color-mix(in srgb,#199e70 25%,transparent);color:#4fd6a3}.gr-m.no{background:color-mix(in srgb,var(--up) 22%,transparent);color:#ff9a9a}
.tl{position:relative;padding-left:4px}
.tl-i{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;border-left:2px solid var(--line);padding-left:12px;margin-left:4px;position:relative;font-size:13.5px;word-break:keep-all}
.tl-i::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tl-w{font-weight:700;color:var(--c);font-size:12.5px}.tl-i small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
/* 막대 */
.hb{display:grid;gap:9px}
.hb-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px;cursor:default}
.hb-row[onclick]{cursor:pointer}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb-l small{display:block;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:12px;background:var(--panel2);border-radius:0 4px 4px 0;overflow:hidden}.hb-f{height:100%;border-radius:0 4px 4px 0}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.rk{display:inline-flex;width:18px;height:18px;border-radius:6px;background:var(--panel2);font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:6px;color:var(--sub)}
.rk.big{width:30px;height:30px;font-size:15px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);margin:0}
.db{display:grid;gap:8px}
.db-row{display:grid;grid-template-columns:minmax(70px,34%) 1fr 58px;gap:8px;align-items:center;font-size:13px}
.db-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.db-l small{display:block;color:var(--dim);font-size:11px;white-space:normal;line-height:1.35}
.db-t{position:relative;height:14px}.db-z{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--dim)}
.db-f{position:absolute;top:1px;height:12px;border-radius:4px}
.db-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.vc{position:relative;display:flex;gap:4px;align-items:stretch;margin:6px 0 24px}
.vc-z{position:absolute;left:0;right:0;height:1px;background:var(--dim)}
.vc-c{flex:1;position:relative;min-width:0}
.vc-b{position:absolute;left:12%;right:12%;border-radius:3px}
.vc-n{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;color:var(--sub);white-space:nowrap;line-height:12px}
.vc-x{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);white-space:nowrap}
.lc{width:100%;height:auto;display:block;overflow:visible}
.lc-g{stroke:var(--line);stroke-width:1}.lc-z{stroke:var(--dim);stroke-width:1}
.lc-a{font-size:10px;fill:var(--dim)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin:4px 0 10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.lg b{color:var(--text)}
.dn-w{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.dnut{width:120px;height:120px}.dn-c{fill:var(--text);font-size:15px;font-weight:800}.dn-s{fill:var(--dim);font-size:10px}
.dn-l{display:grid;gap:6px;font-size:12.5px}.dn-l div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.dn-l i{width:10px;height:10px;border-radius:3px}
/* 범위 막대 (단타) */
.rg{position:relative;height:46px;margin:6px 4px 0}
.rg-t{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:99px;background:var(--panel2)}
.rg-r{position:absolute;top:20px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--down),var(--up))}
.rg-z,.rg-n{position:absolute;top:14px;width:2px;height:18px;transform:translateX(-1px);background:var(--text)}
.rg-n{width:12px;height:12px;border-radius:50%;top:17px;transform:translateX(-6px);border:2px solid var(--bg);background:var(--text)}
.rg-n.up{background:var(--up)}.rg-n.dn{background:var(--down)}
.rg-z em,.rg-n em{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;white-space:nowrap}
.rg-z em{top:-14px;color:var(--dim)}.rg-n em.r{left:auto;right:-4px;transform:none}.rg-n em.l{left:-4px;transform:none}.rg-n em{top:14px;font-weight:700;color:var(--text)}
.rg-e{position:absolute;top:0;font-size:10px;color:var(--dim)}
/* 가격 그래프 */
.sp-box{margin:10px -2px 4px;min-height:64px}
.sparkw{position:relative}
.spark{width:100%;height:100%;display:block}
.spark-dot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-4px,-4px);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.spark-ref{position:absolute;left:4px;transform:translateY(-120%);font-size:10px;color:var(--sub);background:rgba(11,15,23,.7);padding:0 4px;border-radius:4px}
.spark-cap{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--dim);margin-top:4px}.spark-cap b{font-size:12.5px}
.spark-empty{height:64px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;background:var(--panel2);border-radius:10px}
/* 종목 카드 */
.cgrid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cc>.row:first-child{flex-wrap:nowrap}.cc .nm2{flex:1}
@media (min-width:620px){.cgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.nm2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.nm2 a{color:inherit;text-decoration:none}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.st4 div{background:var(--panel2);border-radius:10px;padding:6px 7px}.st4 small{display:block;color:var(--dim);font-size:10.5px}.st4 b{font-size:13px}
.pt{font-size:12px;color:var(--sub);line-height:1.5;margin:4px 0 8px;word-break:keep-all}
.tags{margin:2px 0 4px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum3:has(> .kv:nth-child(4)){grid-template-columns:repeat(2,1fr)}
.sum3 .kv{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.sum3 .kv b{font-size:20px}
.g2{display:grid;gap:0}
@media (min-width:620px){.g2{grid-template-columns:1fr 1fr;gap:12px}}
.seg2{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg2 button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px}
.seg2 button.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sig{margin:4px 0 10px}.sig small{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}
.whale-hero .row{align-items:flex-end}
.hl{display:grid;grid-template-columns:44px 1fr auto 64px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.hl:first-child{border-top:0}.hl a{color:var(--text);text-decoration:none}.hl-r{text-align:right}
/* 관심섹터 */
.sect .sect-n{font-size:18px}
.picks{display:grid;gap:6px;margin-top:12px}
.pick{display:block;background:var(--panel2);border-radius:12px;padding:9px 11px;text-decoration:none;color:var(--text);font-size:14px}
.pick small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.gchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gc{background:var(--panel2);border-radius:10px;padding:7px}.gc small{display:block;color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gc b{font-size:13px}

.warn-test{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;padding:14px 15px;border-radius:16px;

footer{color:var(--dim);font-size:11px;text-align:center;padding:24px 16px 40px}

<body>
<header>
  <div class="top">
    <div class="brand"><span id="brandDot">CH</span> Investing</div>
    <div class="stamp" id="stamp">불러오는 중…</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"><div class="loading">불러오는 중…</div></main>
<footer>※ 참고용 자료입니다. 투자 판단과 책임은 본인에게 있습니다.</footer>

<script src="viz.js?v=4"></script>
<script>
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var CATS = [
  {key:"market", name:"시황",     icon:"🌐", color:"#7c9cff", desc:"오늘의 시장 전략 리포트"},
  {key:"whale",  name:"고래",     icon:"🐋", color:"#3dd6c6", desc:"기관·유명 투자자 TOP 40 보유 변화"},
  {key:"cup",    name:"컵차트",   icon:"☕", color:"#ffb84d", desc:"컵앤핸들 돌파 후보"},
  {key:"gap",    name:"갭차트",   icon:"📈", color:"#c38bff", desc:"갭 돌파 후보"},
  {key:"sector", name:"관심섹터", icon:"🎯", color:"#4dd47a", desc:"모닝 섹터 브리핑 · 오늘 볼 섹터"},
  {key:"accum",  name:"조용한 매집", icon:"🤫", color:"#ff8fc7", desc:"거래량은 늘고 가격은 제자리인 종목"},
  {key:"onepager", name:"원페이지", icon:"📄", color:"#5ac8fa", desc:"약 2만 종목 한 장 요약 · 검색하면 바로"},
  {key:"danta",  name:"단타",     icon:"⚡", color:"#ff6b6b", desc:"장중 단타 알람 · 이후 수익률 추적 · 시험 중"}
];
var M = null, cur = null, curDate = null, store = {};
try { store = JSON.parse(localStorage.getItem("app") || "{}"); } catch(e) {}
function save(){ try { localStorage.setItem("app", JSON.stringify(store)); } catch(e) {} }

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function pct(v){ if (v == null) return "–"; return '<span class="' + (v > 0 ? "up" : v < 0 ? "dn" : "") + '">' + (v > 0 ? "+" : "") + v.toFixed(1) + "%</span>"; }
function won(v){ return v == null ? "–" : Math.round(v).toLocaleString("ko-KR"); }
var WD = ["일","월","화","수","목","금","토"];
function dateLabel(id){
  var d = id.slice(0, 10), t = id.slice(11);
  var w = WD[new Date(d + "T00:00:00+09:00").getDay()];
  var tag = {AM:"오전", PM:"오후", HOL:"휴장", WEEK:"주간 회고", MONTH:"월간 회고"}[t] || t;
  return '<b>' + d.slice(5).replace("-", "/") + '</b>' + w + (tag ? " · " + tag : "");
}
function file(cat, id, name){ return "archive/" + cat + "/" + id + "/" + encodeURIComponent(name); }

/* ---------- 탭 ---------- */
function drawTabs(){
  $("tabs").innerHTML = CATS.map(function(c){
    return '<button class="tab' + (c.key === cur ? " on" : "") + '" style="--c:' + c.color + '" data-k="' + c.key + '"><span class="ic">' + c.icon + '</span><span class="tn">' + (c.short || c.name) + '</span></button>';
  }).join("");
  [].forEach.call($("tabs").children, function(b){ b.onclick = function(){ go(b.dataset.k); }; });
}

function go(key, id){
  cur = key; store.tab = key; save();
  var c = CATS.filter(function(x){ return x.key === key; })[0];
  document.documentElement.style.setProperty("--c", c.color);
  $("brandDot").style.color = c.color;
  drawTabs();
  var items = (M.cats[key] || []);
  curDate = id || (items[0] && items[0].id);
  var h = '<section class="hero"><h1>' + c.icon + " " + c.name + '</h1><p>' + c.desc + '</p><div class="meta">' +
          (key === "onepager" ? '<span class="chip">🇺🇸 🇰🇷 🇯🇵 🇨🇳 🇭🇰</span>' : '<span class="chip">누적 ' + items.length + '일</span>') +
          (items[0] && key !== "onepager" ? '<span class="chip">최신 ' + items[0].id.slice(0, 10) + '</span>' : '') + '</div></section>';
  if (key === "onepager") { $("main").innerHTML = h + opView(); opInit(id); window.scrollTo(0, 0); return; }
  if (!items.length) {
    h += '<div class="empty"><div class="big">🗂️</div>아직 모인 자료가 없어요.<br>' +
         "다음 자동 수집 때 채워져요." + '</div>';
    $("main").innerHTML = h; window.scrollTo(0, 0); return;
  }
  h += '<div class="dates" id="dates">' + items.map(function(it){
    return '<button class="date' + (it.id === curDate ? " on" : "") + '" data-id="' + it.id + '">' + dateLabel(it.id) + '</button>';
  }).join("") + '</div><div id="body"><div class="loading">불러오는 중…</div></div>';
  $("main").innerHTML = h;
  [].forEach.call($("dates").children, function(b){ b.onclick = function(){ go(key, b.dataset.id); }; });
  var on = $("dates").querySelector(".on"); if (on) on.scrollIntoView({inline:"center", block:"nearest"});
  var it = items.filter(function(x){ return x.id === curDate; })[0];
  window.scrollTo(0, 0);
  RENDER[key](it, $("body"));
}

/* ---------- 렌더러 ---------- */
function getText(u){ return fetch(u).then(function(r){ if (!r.ok) throw 0; return r.text(); }); }
function getJSON(u){ return fetch(u).then(function(r){ if (!r.ok) throw 0; return r.json(); }); }

function pdfCard(title, url){
  var id = "p" + Math.random().toString(36).slice(2);
  setTimeout(function(){ renderPdf(url, $(id)); }, 0);
  return '<div class="card"><h3>' + title + ' <a class="btn" href="' + url + '" target="_blank">크게 보기 ↗</a></h3><div class="pdf" id="' + id + '"><div class="loading">PDF 여는 중…</div></div></div>';
}
function renderPdf(url, box){
  if (!box) return;
  if (!window.pdfjsLib) { box.innerHTML = '<div class="loading">"크게 보기"를 눌러 PDF를 열어주세요.</div>'; return; }
  pdfjsLib.getDocument(url).promise.then(function(pdf){
    box.innerHTML = "";
    var n = 0;
    function next(){
      if (++n > pdf.numPages || !document.body.contains(box)) return;
      pdf.getPage(n).then(function(page){
        var w = box.clientWidth || 340, vp0 = page.getViewport({scale:1});
        var scale = w / vp0.width * Math.min(window.devicePixelRatio || 1, 2.5);
        var vp = page.getViewport({scale: scale});
        var cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
        box.appendChild(cv);
        page.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise.then(next);
      });
    }
    next();
  }).catch(function(){ box.innerHTML = '<div class="loading">PDF를 열지 못했어요. "크게 보기"를 눌러주세요.</div>'; });
}

var RENDER = {
  market: function(it, el){
    var h = "", files = it.files;
    var txt = files.filter(function(f){ return f.endsWith(".txt"); })[0];
    var pdfs = files.filter(function(f){ return f.endsWith(".pdf"); }).sort(function(a){ return /Summary/i.test(a) ? -1 : 1; });
    pdfs.forEach(function(f){ h += pdfCard(/Summary/i.test(f) ? "요약본" : "전체 리포트", file("market", it.id, f)); });
    if (txt) {
      h = '<div class="card"><h3>한눈에 보기</h3><div class="txt" id="mtxt">…</div></div>' + h;
      getText(file("market", it.id, txt)).then(function(t){ $("mtxt") && ($("mtxt").textContent = t); });
    }
    if (files.indexOf("review.md") >= 0) {
      h = '<div class="card md" id="mrev">…</div>' + h;
      getText(file("market", it.id, "review.md")).then(function(t){ $("mrev") && ($("mrev").innerHTML = window.marked ? marked.parse(t) : "<pre class=\"txt\">" + esc(t) + "</pre>"); });
    }
    el.innerHTML = '<div id="live"></div>' + h +
      '<div class="card"><h3>전략 대시보드 <button class="btn" id="dashbtn">열기</button></h3><div id="dash"></div></div>';
    marketBoard($("live"));
    $("dashbtn").onclick = function(){
      $("dashbtn").remove(); $("dash").innerHTML = '<div class="loading">여는 중…</div>';
      getText(RAW + "market-strategy-report/main/docs/index.html").then(function(t){
        $("dash").innerHTML = '<iframe class="rep" id="dashf"></iframe>';
        var f = $("dashf"); f.onload = function(){ try { var d = f.contentDocument; d.querySelectorAll("a").forEach(function(a){ a.target = "_blank"; }); f.style.height = d.documentElement.scrollHeight + 10 + "px"; } catch(e) {} };
        f.srcdoc = t;
      }).catch(function(){ $("dash").innerHTML = '<div class="loading">대시보드를 못 불러왔어요.</div>'; });
    };
  },

  danta: function(it, el){
    getJSON(file("danta", it.id, "alerts.json")).then(function(rows){
      rows.sort(function(a, b){ return a.time < b.time ? 1 : -1; });
      var nowv = rows.map(function(r){ return r.now; }).filter(function(v){ return v != null; });
      var avg = nowv.length ? nowv.reduce(function(a, b){ return a + b; }, 0) / nowv.length : null;
      var win = nowv.filter(function(v){ return v > 0; }).length;
      var h = '<div class="sum"><div class="kv"><small>알람</small><b>' + rows.length + '건</b></div>' +
              '<div class="kv"><small>현재 평균</small><b>' + pct(avg) + '</b></div>' +
              '<div class="kv"><small>플러스</small><b>' + win + ' / ' + nowv.length + '</b></div></div><div class="list">';
      rows.forEach(function(r){
        var ex = r.exit ? '<span class="pill ' + (/손절|이탈/.test(r.exit) ? "cool" : "hot") + '">' + esc(r.exit) + '</span>' : "";
        h += '<div class="st"><div class="row"><div class="nm"><a href="https://m.stock.naver.com/domestic/stock/' + r.code + '/total" target="_blank">' + esc(r.name) + '</a><span class="cd">' + r.code + '</span></div>' +
             '<span class="tm">' + r.time + ' <a class="btn" style="padding:2px 7px" href="javascript:openOP(\'' + esc(r.code) + '\')">원페이지</a></span></div>' +
             '<div class="row" style="margin-top:6px;justify-content:flex-start;gap:6px"><span class="pill c">' + esc(r.type) + '</span>' + ex +
             '<span class="tm">알람가 ' + won(r.price) + '원 · 당일 ' + pct(r.chg) + '</span></div>' +
             '<div class="grid4"><div class="kv"><small>30분</small><b>' + pct(r.m30) + '</b></div><div class="kv"><small>최고</small><b>' + pct(r.high) + '</b></div>' +
             '<div class="kv"><small>최저</small><b>' + pct(r.low) + '</b></div><div class="kv"><small>현재</small><b>' + pct(r.now) + '</b></div></div>' +
             (r.stop ? '<div class="tm" style="margin-top:8px">🛑 ' + won(r.stop) + ' · 💰 ' + won(r.t1) + ' · 💎 ' + won(r.t2) + '</div>' : "") + '</div>';
      });
      el.innerHTML = '<div id="bt"></div>' + h + "</div>";
      backtestCard($("bt"));
    }).catch(function(){ el.innerHTML = '<div class="empty">자료를 못 불러왔어요.</div>'; });
  },

  whale: function(it, el){
    var h = "";
    if (it.files.indexOf("report.html") >= 0) {
      h += '<div class="card" style="padding:8px"><iframe class="rep" id="wf" src="' + file("whale", it.id, "report.html") + '"></iframe></div>';
    }
    if (it.files.indexOf("report.pdf") >= 0) h += '<div class="card"><h3>PDF 리포트 <a class="btn" href="' + file("whale", it.id, "report.pdf") + '" target="_blank">열기 ↗</a></h3></div>';
    el.innerHTML = h;
    var f = $("wf");
    if (f) f.onload = function(){ try { f.style.height = f.contentWindow.document.documentElement.scrollHeight + 20 + "px"; } catch(e) {} };
  },

  cup: function(it, el){ el.innerHTML = pdfCard("컵앤핸들 리포트", file("cup", it.id, "report.pdf")); },
  gap: function(it, el){ el.innerHTML = pdfCard("갭 돌파 리포트", file("gap", it.id, "report.pdf")); },

  sector: function(it, el){
    var h = "";
    if (it.files.indexOf("briefing.txt") >= 0) h += '<div class="card"><h3>모닝 섹터 브리핑</h3><div class="txt" id="brf">…</div></div>';
    if (it.files.indexOf("heatmap.png") >= 0) h += '<div class="card"><h3>섹터 히트맵</h3><img style="width:100%;border-radius:10px" src="' + file("sector", it.id, "heatmap.png") + '"></div>';
    if (it.files.indexOf("sector.md") >= 0) h += '<div class="card md" id="smd">…</div>';
    el.innerHTML = '<div id="tlog"></div>' + h;
    themeLog($("tlog"), it.id.slice(0, 10));
    if ($("brf")) getText(file("sector", it.id, "briefing.txt")).then(function(t){
      // 텔레그램 형식(b, i, a 태그)만 살려서 표시
      var safe = esc(t.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"))
        .replace(/&lt;(\/?)(b|i)&gt;/g, "<$1$2>");
      $("brf").innerHTML = safe.trim();
    });
    if ($("smd")) getText(file("sector", it.id, "sector.md")).then(function(t){ $("smd").innerHTML = window.marked ? marked.parse(t) : "<pre class=\"txt\">" + esc(t) + "</pre>"; });
  },

  accum: function(it, el){
    getJSON(file("accum", it.id, "list.json")).then(function(rows){
      var mk = {}; rows.forEach(function(r){ mk[r.mkt] = (mk[r.mkt] || 0) + 1; });
      var names = {KR:"🇰🇷 한국", US:"🇺🇸 미국", JP:"🇯🇵 일본", CN:"🇨🇳 중국", HK:"🇭🇰 홍콩"};
      var sel = "ALL", shown = 20;
      function draw(){
        var list = rows.filter(function(r){ return sel === "ALL" || r.mkt === sel; });
        var h = '<div class="seg">' + ['ALL'].concat(Object.keys(mk)).map(function(k){
          return '<button data-k="' + k + '" class="' + (k === sel ? "on" : "") + '">' + (k === "ALL" ? "전체 " + rows.length : (names[k] || k) + " " + mk[k]) + '</button>';
        }).join("") + '</div><div class="list">';
        list.slice(0, shown).forEach(function(r){
          var cls = r.dist ? "cool" : r.tag === "강한 매집" ? "hot" : "c";
          var link = r.mkt === "KR" ? "https://m.stock.naver.com/domestic/stock/" + r.code + "/total" : "https://finance.yahoo.com/quote/" + r.code;
          h += '<div class="st"><div class="row"><div class="nm"><a href="' + link + '" target="_blank">' + esc(r.name) + '</a><span class="cd">' + esc(r.code) + '</span></div>' +
               '<span class="pill ' + cls + '">' + (r.dist ? "분배 의심" : esc(r.tag)) + '</span></div>' +
               '<div class="tm" style="margin-top:4px"><a class="btn" style="padding:2px 7px;float:right" href="javascript:openOP(\'' + esc(r.code) + '\')">원페이지</a>' + (names[r.mkt] || r.mkt) + (r.sector && r.sector !== "미분류" ? " · " + esc(r.sector) : "") + (r.days > 1 ? " · 매집 " + r.days + "일째" : "") + '</div>' +
               '<div class="grid4"><div class="kv"><small>매집점수</small><b>' + (r.score == null ? "–" : r.score.toFixed(0)) + '</b></div>' +
               '<div class="kv"><small>거래량</small><b>' + (r.vol == null ? "–" : r.vol.toFixed(1) + "배") + '</b></div>' +
               '<div class="kv"><small>한달 가격</small><b>' + pct(r.m1) + '</b></div>' +
               '<div class="kv"><small>상대강도</small><b>' + (r.rs == null ? "–" : r.rs.toFixed(0)) + '</b></div></div></div>';
        });
        h += "</div>" + (list.length > shown ? '<button class="more" id="more">더 보기 (' + (list.length - shown) + '개 남음)</button>' : "");
        el.innerHTML = h;
        [].forEach.call(el.querySelectorAll(".seg button"), function(b){ b.onclick = function(){ sel = b.dataset.k; shown = 20; draw(); }; });
        if ($("more")) $("more").onclick = function(){ shown += 20; draw(); };
      }
      draw();
    }).catch(function(){ el.innerHTML = '<div class="empty">자료를 못 불러왔어요.</div>'; });
  }
};

/* ---------- 각 프로젝트 실시간 자료 (원본 저장소에서 바로 읽기) ---------- */
var RAW = "https://raw.githubusercontent.com/chkchp0702-spec/";
function parseCSV(t){
  var rows = [], row = [], f = "", q = false;
  t = t.replace(/^\ufeff/, "");
  for (var i = 0; i < t.length; i++){ var c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; } else if (c !== "\r") f += c; }
  if (f || row.length){ row.push(f); rows.push(row); }
  var hd = rows.shift() || [];
  return rows.filter(function(r){ return r.length > 1; }).map(function(r){ var o = {}; hd.forEach(function(k, i){ o[k] = r[i]; }); return o; });
}
function marketBoard(el){
  if (!el) return;
  getJSON(RAW + "market-strategy-report/main/market/latest.json?" + Date.now()).then(function(d){
    var keys = ["kospi","kosdaq","foreign_kospi","sp500","nasdaq","dow","vix","us10y","usdkrw","dxy","wti","gold","samsung","hynix","nvidia","micron"];
    var it = d.items || {};
    var cells = keys.filter(function(k){ return it[k] && it[k].value != null; }).map(function(k){
      var x = it[k], v = x.value, cp = x.change_pct;
      var val = k === "foreign_kospi" ? (v > 0 ? "+" : "") + Math.round(v).toLocaleString() + "억" :
                (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : v.toLocaleString(undefined, {maximumFractionDigits:2}));
      var cls = (k === "foreign_kospi" ? v : cp) > 0 ? "up" : (k === "foreign_kospi" ? v : cp) < 0 ? "dn" : "";
      return '<div class="kv"><small>' + esc(x.name.replace("코스피 외국인 순매수(억원)", "외국인 순매수")) + '</small><b class="' + cls + '">' + val + '</b>' +
             (cp != null ? '<small class="' + cls + '">' + (cp > 0 ? "+" : "") + cp.toFixed(2) + '%</small>' : '') + '</div>';
    }).join("");
    el.innerHTML = '<div class="card"><h3>실시간 시장판 <span class="tm">' + esc(d.fetched_kst || "") + ' 기준</span></h3><div class="board">' + cells + '</div></div>';
  }).catch(function(){ el.innerHTML = ""; });
}
function backtestCard(el){
  if (!el) return;
  fetch("https://api.github.com/repos/chkchp0702-spec/stock-screener/contents/data/backtest").then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(list){
    var f = list.filter(function(x){ return /\.csv$/.test(x.name); }).sort(function(a, b){ return a.name < b.name ? 1 : -1; })[0];
    if (!f) throw 0;
    return getText(RAW + "stock-screener/main/data/backtest/" + f.name).then(function(t){

/* ---------- 원페이지 (미리 만든 리포트 + 최신 종가) ---------- */
var OPD = "https://raw.githubusercontent.com/chkchp0702-spec/daily-app/opdata/";
var OPIDX = null, OPCSS = null, OPP = {}, FX = null;
function fmtKRW(v, kind){
  if (kind === "p") return Math.round(v).toLocaleString("ko-KR") + "원";
  var a = Math.abs(v), sgn = v < 0 ? "-" : "";
  if (a >= 1e12){ var j = a / 1e12; return sgn + (j >= 100 ? Math.round(j).toLocaleString("ko-KR") : j.toFixed(1)) + "조 원"; }
  if (a >= 1e8){ var o = a / 1e8; return sgn + (o >= 100 ? Math.round(o).toLocaleString("ko-KR") : o.toFixed(1)) + "억 원"; }
  return sgn + Math.round(a / 1e4).toLocaleString("ko-KR") + "만 원";
}
var FLAG = {US:"🇺🇸", KR:"🇰🇷", JP:"🇯🇵", CN:"🇨🇳", HK:"🇭🇰"};
function norm(t){ return String(t || "").normalize("NFKC").toLowerCase().replace(/[\s\-_.,·()]+/g, ""); }
function fnv(str){ var h = 0x811c9dc5, b = new TextEncoder().encode(str);
  for (var i = 0; i < b.length; i++){ h ^= b[i]; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function opShard(sym){ var x = (fnv(sym) % 256).toString(16); return x.length < 2 ? "0" + x : x; }
function opFile(sym){ return sym.replace(/[^A-Za-z0-9.-]/g, "_"); }

function opView(){
  return '<div class="card"><h3>종목 찾기</h3><div class="reqrow"><input id="opq" placeholder="예: 삼성전자, 엔비디아, AAPL, KODEX 200, QQQ" autocomplete="off" enterkeyhint="search"></div>' +
         '<div id="opsug" class="sug"></div><div class="tm" id="opmsg" style="margin-top:8px">미국·한국·일본·중국·홍콩 약 2만 종목 + ETF · 최근 종가 기준</div></div>' +
         '<div id="oppick"></div><div id="opbox"></div>';
}
function opLoadIdx(){
  if (OPIDX) return Promise.resolve(OPIDX);
  return getJSON(OPD + "idx.json").then(function(x){
    OPIDX = x.map(function(r){ return {sym:r[0], name:r[1], mkt:r[2], built:r[4], etf:r[5] === "E", key:norm(r[0] + " " + r[1] + " " + r[3]), n1:norm(r[1]), s1:norm(r[0]), alts:r[3].split(" ").map(norm)}; });
    return OPIDX;
  });
}
function opSearch(q){
  q = norm(q); if (!q) return [];
  var out = [];
  OPIDX.forEach(function(r){
    var sc = 0;
    if (r.s1 === q || r.n1 === q || r.alts.indexOf(q) >= 0) sc = 100;
    else if (r.n1.indexOf(q) === 0 || r.s1.indexOf(q) === 0) sc = 60;
    else if (r.key.indexOf(q) >= 0) sc = 30;
    if (sc) out.push([sc + (r.built ? 5 : 0) - r.name.length / 100, r]);
  });
  out.sort(function(a, b){ return b[0] - a[0]; });
  return out.slice(0, 8).map(function(x){ return x[1]; });
}
function opInit(first){
  $("opmsg").textContent = "종목 목록 불러오는 중…";
  opLoadIdx().then(function(){
    var ready = OPIDX.filter(function(r){ return r.built; }).length, ne = OPIDX.filter(function(r){ return r.etf; }).length;
    $("opmsg").textContent = "미국·한국·일본·중국·홍콩 " + (OPIDX.length - ne).toLocaleString() + "종목" + (ne ? " + ETF " + ne.toLocaleString() + "개" : "") + " · " + ready.toLocaleString() + "개 준비됨 · 최근 종가 기준";
    var q = $("opq");
    q.oninput = function(){
      var res = opSearch(q.value);
      $("opsug").innerHTML = res.map(function(r){
        return '<button data-s="' + esc(r.sym) + '">' + (FLAG[r.mkt] || "") + " <b>" + esc(r.name) + '</b>' + (r.etf ? '<span class="etfb">ETF</span>' : "") + '<small>' + esc(r.sym) + (r.built ? "" : " · 준비 중") + '</small></button>';
      }).join("");
      [].forEach.call($("opsug").children, function(b){ b.onclick = function(){ q.value = ""; $("opsug").innerHTML = ""; q.blur(); opShow(b.dataset.s); }; });
    };
    q.onkeydown = function(e){ if (e.key === "Enter"){ var r = opSearch(q.value)[0]; if (r){ q.value = ""; $("opsug").innerHTML = ""; q.blur(); opShow(r.sym); } } };
    opPicks();
    if (first){ var f = opFind(first); if (f) opShow(f.sym); }
  }).catch(function(){ $("opmsg").textContent = "아직 준비 중이에요. 잠시 뒤 다시 열어주세요."; });
}
function opFind(code){
  var c = norm(code);
  for (var i = 0; i < OPIDX.length; i++){ var r = OPIDX[i]; if (r.s1 === c || r.n1 === c || r.alts.indexOf(c) >= 0) return r; }
  return null;
}
function opPicks(){
  var L = M.cats.danta || [], A = M.cats.accum || [];
  var jobs = [];
  if (L[0]) jobs.push(getJSON(file("danta", L[0].id, "alerts.json")).then(function(r){ return r.map(function(x){ return x.code; }); }).catch(function(){ return []; }));
  if (A[0]) jobs.push(getJSON(file("accum", A[0].id, "list.json")).then(function(r){ return r.slice(0, 8).map(function(x){ return x.code; }); }).catch(function(){ return []; }));
  Promise.all(jobs).then(function(lists){
    var seen = {}, rows = [];
    [].concat.apply([], lists).forEach(function(c){ var r = opFind(c); if (r && r.built && !seen[r.sym]){ seen[r.sym] = 1; rows.push(r); } });
    if (!rows.length) return;
    $("oppick").innerHTML = '<div class="tm" style="margin:0 2px 6px">오늘 단타·매집에 나온 종목</div><div class="opl">' + rows.map(function(r){
      return '<button class="opb" data-s="' + esc(r.sym) + '">' + (FLAG[r.mkt] || "") + " " + esc(r.name) + '<small>' + esc(r.sym) + '</small></button>'; }).join("") + '</div>';
    [].forEach.call($("oppick").querySelectorAll(".opb"), function(b){ b.onclick = function(){ opShow(b.dataset.s); }; });
  });
}
function fmtPrice(v, u){ if (v == null) return "–"; var dec = (u === "원" || u === "엔" || Math.abs(v) >= 1000) ? 0 : 2;
  var s = Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:dec, maximumFractionDigits:dec}); s = (v < 0 ? "-" : "") + s;
  return (u === "원" || u === "엔") ? s + u : s + " " + u; }
function opChart(p, u){
  var vals = p[6]; if (!vals || vals.length < 2) return '<div class="muted">차트 데이터 없음</div>';
  var W = 320, H = 130, pl = 4, pb = 18, pt = 10, lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rng = (hi - lo) || 1, st = (W - pl * 2) / (vals.length - 1);
  var pts = vals.map(function(v, i){ return [pl + i * st, pt + (hi - v) / rng * (H - pt - pb)]; });
  var line = pts.map(function(x){ return x[0].toFixed(1) + "," + x[1].toFixed(1); }).join(" ");
  var up = vals[vals.length - 1] >= vals[0], c = up ? "#c0392b" : "#1f4e9c", chg = (vals[vals.length - 1] / vals[0] - 1) * 100, last = pts[pts.length - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="spark"><polygon points="' + pts[0][0].toFixed(1) + ',' + (H - pb) + ' ' + line + ' ' + last[0].toFixed(1) + ',' + (H - pb) + '" fill="' + c + '" opacity="0.10"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + c + '" stroke-width="1.8"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="' + c + '"/>' +
    '<text x="' + pl + '" y="' + (H - 4) + '" class="ax">' + p[5] + '</text><text x="' + (W - pl) + '" y="' + (H - 4) + '" class="ax" text-anchor="end">' + p[0] + '</text>' +
    '<text x="' + (W - pl) + '" y="12" class="ax" text-anchor="end" fill="' + c + '">1년 ' + (chg >= 0 ? "+" : "") + chg.toFixed(1) + '%</text></svg>' +
    '<div class="muted small">1년 최고 ' + fmtPrice(p[3], u) + ' · 최저 ' + fmtPrice(p[4], u) + ' (주간 종가 그래프)</div>';
}
function opShow(sym){
  var r = OPIDX.filter(function(x){ return x.sym === sym; })[0];
  var box = $("opbox");
  if (!r) return;
  if (!r.built){ box.innerHTML = '<div class="empty"><div class="big">⏳</div><b>' + esc(r.name) + '</b> 리포트는 아직 만드는 중이에요.<br>매일 밤 조금씩 채워지고 있어요.</div>'; return; }
  box.innerHTML = '<div class="loading">' + esc(r.name) + ' 여는 중…</div>';
  var sh = opShard(sym);
  Promise.all([
    getText(OPD + "s/" + opFile(sym) + ".html"),
    OPCSS ? Promise.resolve(OPCSS) : getText(OPD + "op.css").then(function(c){ OPCSS = c; return c; }),
    OPP[sh] ? Promise.resolve(OPP[sh]) : getJSON(OPD + "p/" + sh + ".json").then(function(j){ OPP[sh] = j; return j; }).catch(function(){ return {}; }),
    FX ? Promise.resolve(FX) : getJSON(OPD + "p/fx.json").then(function(j){ FX = j; return j; }).catch(function(){ return null; })
  ]).then(function(res){
    var html = res[0].replace("<style></style>", "<style>" + res[1] + "</style>");
    box.innerHTML = '<div class="card" style="padding:6px"><iframe class="rep" id="opf"></iframe></div>';
    var fr = $("opf");
    fr.onload = function(){
      var d = fr.contentDocument, p = res[2][sym];
      try {
        var hdr = d.querySelector(".hdr"), u = ((hdr && hdr.textContent.match(/통화\s*([가-힣]+)/)) || [, "달러"])[1];
        if (p){
          var chg = (p[1] / p[2] - 1) * 100;
          d.querySelector(".kpi.k1 .kv").textContent = fmtPrice(p[1], u);
          d.querySelector(".kpi.k1 .ks").innerHTML = '<span class="' + (chg >= 0 ? "up" : "down") + '">' + (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%</span> · " + p[0].slice(5).replace("-", "/") + " 종가";
          [].forEach.call(d.querySelectorAll("h2"), function(h){ if (/주가/.test(h.textContent)){ h.parentNode.innerHTML = "<h2>주가 (1년)</h2>" + opChart(p, u); } });
          if (hdr) hdr.innerHTML = "가격 " + p[0] + " 종가<br>설명 " + hdr.innerHTML.split("<br>")[0] + " 기준<br>통화 " + u + (u !== "원" ? '<br><span class="fxl"></span>' : "");
          var w = d.querySelector(".w52"), lo = w && +w.getAttribute("data-lo"), hi = w && +w.getAttribute("data-hi");
          if (w && hi > lo){ var n = w.querySelector(".w52-n"), pos = Math.max(0, Math.min(100, (p[1] - lo) / (hi - lo) * 100));
            n.style.left = pos.toFixed(1) + "%"; var em = n.querySelector("em"); if (em){ em.textContent = "현재 " + fmtPrice(p[1], u); em.className = pos > 85 ? "r" : pos < 15 ? "l" : ""; } }
        }
        [].forEach.call(d.querySelectorAll("h2"), function(h){ if (/뉴스/.test(h.textContent)){
          var a = d.createElement("a"); a.href = "https://news.google.com/search?q=" + encodeURIComponent(r.name + " 주가") + "&hl=ko&gl=KR&ceid=KR:ko";
          a.target = "_blank"; a.textContent = "최신 뉴스 더 보기 ↗"; a.style.cssText = "display:inline-block;margin-top:8px;font-size:12px;color:#1f4e9c";
          h.parentNode.appendChild(a); } });
        d.querySelectorAll("a").forEach(function(a){ a.target = "_blank"; });
        // ETF 구성 종목 → 누르면 그 종목 리포트
        d.querySelectorAll("[data-op]").forEach(function(el){
          var f = opFind(el.getAttribute("data-op"));
          if (!f){ el.removeAttribute("data-op"); var g = el.querySelector(".hl-go"); if (g) g.remove(); return; }
          el.addEventListener("click", function(){ opShow(f.sym); });
        });
        var h1 = d.querySelector(".hd h1");
        if (h1 && r.name && h1.textContent.trim() !== r.name){
          var en = h1.textContent.trim(); h1.textContent = r.name;
          var sm = d.createElement("div"); sm.textContent = en; sm.style.cssText = "font-size:13px;color:#b9c4d8;margin-top:2px"; h1.after(sm);
        }
        if (FX){
          var CU = {USD:"달러", CNY:"위안", JPY:"엔", HKD:"홍콩달러"};
          d.querySelectorAll(".krw").forEach(function(k){ var r = FX[k.getAttribute("data-c")], v = +k.getAttribute("data-v");
            if (r && !isNaN(v)) k.textContent = "≈ " + fmtKRW(v * r, k.getAttribute("data-k")); });
          var fl = d.querySelector(".fxl"), cu = u, code = Object.keys(CU).filter(function(c){ return CU[c] === cu; })[0];
          if (fl && code && FX[code]) fl.textContent = "1" + cu + " ≈ " + FX[code].toLocaleString("ko-KR", {maximumFractionDigits:2}) + "원 (" + (FX.date || "").slice(5).replace("-", "/") + ")";
        }
      } catch(e) {}
      fr.style.height = d.documentElement.scrollHeight + 10 + "px";
    };
    fr.srcdoc = html;
    box.scrollIntoView({behavior:"smooth", block:"start"});
  }).catch(function(){ box.innerHTML = '<div class="empty">리포트를 못 불러왔어요. 잠시 뒤 다시 눌러주세요.</div>'; });
}
